<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>案件填表｜卦案</title>
<style id="styles">
  :root{
    --bg:#12100e; --panel:#1a1714; --line:#332c25; --ink:#e8e0d4; --dim:#8b8073;
    --gold:#c8a86b; --warn:#a8623f; --ok:#7d9a6a;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Noto Serif TC","Songti TC",serif;line-height:1.7;font-size:14px}
  button,input,textarea,select{font-family:inherit;color:inherit;font-size:inherit}
  button{cursor:pointer}
  .dim{color:var(--dim)}
  .mono{font-variant-numeric:tabular-nums}
  .warn{color:var(--warn)}
  .ok{color:var(--ok)}
  .gold{color:var(--gold)}

  /* ── 版面：左表右盤，右盤釘住 ── */
  .app{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;
    max-width:1440px;margin:0 auto;padding:18px 20px 80px}
  .side{position:sticky;top:18px;align-self:start;max-height:calc(100vh - 36px);
    overflow-y:auto;display:flex;flex-direction:column;gap:12px}

  /* ── 頂列 ── */
  .top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    padding:0 20px 12px;max-width:1440px;margin:0 auto;
    border-bottom:1px solid var(--line)}
  .top h1{font-size:19px;font-weight:500;letter-spacing:.12em;margin:14px 12px 0 0}
  .top .sp{margin-left:auto}
  .tb{background:var(--panel);border:1px solid var(--line);border-radius:2px;
    padding:6px 12px;font-size:13px;margin-top:14px}
  .tb:hover{border-color:var(--gold);color:var(--gold)}
  .tb.on{border-color:var(--gold);color:var(--gold)}
  .saved{font-size:12px;color:var(--dim);margin-top:14px}

  /* ── 區塊 ── */
  .sec{background:var(--panel);border:1px solid var(--line);border-radius:2px;
    padding:16px 18px;margin-bottom:14px}
  .sec > h2{font-size:13px;letter-spacing:.18em;color:var(--gold);
    margin:0 0 4px;font-weight:500}
  .sec > .cap{color:var(--dim);font-size:12px;margin:0 0 14px}

  /* ── 欄位 ── */
  .f{display:grid;grid-template-columns:104px minmax(0,1fr);gap:10px;
    align-items:start;margin-bottom:10px}
  .f > label{font-size:12px;color:var(--dim);padding-top:7px}
  .f > label b{color:var(--ink);font-weight:400;display:block;font-size:13px}
  input[type=text],textarea,select{width:100%;background:#0e0c0b;
    border:1px solid var(--line);border-radius:2px;padding:7px 9px;
    line-height:1.65;resize:vertical}
  input[type=text]:focus,textarea:focus,select:focus{outline:none;border-color:var(--gold)}
  textarea{min-height:62px}
  .hint{font-size:11px;color:#6e665b;margin-top:3px}
  .bad{border-color:var(--warn) !important}

  /* ── 可增減的列表 ── */
  .item{border:1px solid var(--line);border-radius:2px;padding:12px 13px;margin-bottom:9px;
    background:#151210}
  .item-h{display:flex;align-items:center;gap:8px;margin-bottom:9px}
  .item-h .n{font-size:12px;color:var(--gold);letter-spacing:.1em}
  .x{margin-left:auto;background:none;border:1px solid var(--line);border-radius:2px;
    color:var(--dim);font-size:11px;padding:2px 8px}
  .x:hover{border-color:var(--warn);color:var(--warn)}
  .add{background:none;border:1px dashed var(--line);border-radius:2px;
    color:var(--dim);padding:7px 12px;font-size:12px;width:100%}
  .add:hover{border-color:var(--gold);color:var(--gold)}

  /* ── 六區摺疊 ── */
  .reg{border:1px solid var(--line);border-radius:2px;margin-bottom:10px;background:#151210}
  .reg-h{display:flex;align-items:center;gap:10px;padding:11px 14px;cursor:pointer;
    user-select:none}
  .reg-h:hover{background:#1a1714}
  .reg-h .pos{color:var(--gold);font-size:13px;min-width:2.4em}
  .reg-h .nm{font-size:14px}
  .reg-h .meter{margin-left:auto;font-size:11px;color:var(--dim)}
  .reg-b{padding:0 14px 14px;border-top:1px solid var(--line)}
  .reg[data-open="0"] .reg-b{display:none}

  /* ── 文本槽 ── */
  .slot{display:grid;grid-template-columns:150px minmax(0,1fr);gap:10px;
    align-items:start;margin-bottom:8px}
  .slot-l{padding-top:6px}
  .slot-k{font-size:12px}
  .slot-p{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}
  .slot.next .slot-k{color:var(--gold)}
  .slot.next textarea{border-color:#4a3d2a}
  .slot.done .slot-k{color:var(--ok)}

  /* ── 右盤 ── */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:14px 15px}
  .card h3{font-size:12px;letter-spacing:.18em;color:var(--gold);margin:0 0 10px;font-weight:500}
  .bar{height:6px;background:#0e0c0b;border:1px solid var(--line);border-radius:2px;
    overflow:hidden;margin:8px 0 6px}
  .bar i{display:block;height:100%;background:var(--gold)}
  .big{font-size:26px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.2}
  .todo{width:100%;text-align:left;background:none;border:none;border-top:1px solid var(--line);
    padding:6px 2px;font-size:12px;display:flex;gap:8px;align-items:baseline}
  .todo:hover{color:var(--gold)}
  .todo .p{color:var(--dim);font-variant-numeric:tabular-nums;min-width:3.4em}
  .todo .cum{margin-left:auto;color:#6e665b;font-variant-numeric:tabular-nums}
  .err{font-size:12px;color:var(--warn);margin:0 0 5px;padding-left:1em;text-indent:-1em}

  /* ── 試玩畫面：與 dev/play 共用同一組 class，樣式由 shell 各自帶 ── */
  /* 全部加 #playRoot 範圍：.big 在填表是覆蓋率數字、在原型是大按鈕，
     .bar 在填表是進度條、在原型是狀態列。不分開的話後者會蓋掉前者。 */
  #playRoot .picks{display:grid;gap:8px}
  #playRoot .pick{display:block;width:100%;text-align:left;background:var(--panel);
      border:1px solid var(--line);border-radius:2px;padding:12px 14px}
  #playRoot .pick:hover{border-color:var(--gold)}
  #playRoot .pick.on{border-color:var(--gold);background:#221d17}
  #playRoot .pn{display:block;font-size:15px}
  #playRoot .pd{display:block;font-size:12px;color:var(--dim);margin-top:3px}
  #playRoot .row{display:flex;gap:10px;margin-top:20px}
  #playRoot .big{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:2px;
      padding:14px;font-size:15px;letter-spacing:.1em}
  #playRoot .big:hover{border-color:var(--gold)}
  #playRoot .big.go{border-color:var(--gold);color:var(--gold)}
  #playRoot .gua{background:var(--panel);border:1px solid var(--line);border-radius:2px;
      padding:14px 16px;margin:14px 0;font-size:13px}
  #playRoot .ghead{font-size:15px;margin-bottom:8px}
  #playRoot .gline{margin:3px 0}
  #playRoot .acc{color:var(--gold)}
  #playRoot .acc-void, #playRoot .acc-hiddenHard, #playRoot .acc-contested{color:var(--warn)}
  #playRoot .acc-open, #playRoot .acc-stirring{color:var(--ok)}
  #playRoot .gtab{width:100%;border-collapse:collapse;margin-top:10px;font-size:12px}
  #playRoot .gtab td{padding:3px 6px;border-top:1px solid var(--line);white-space:nowrap}
  #playRoot .gtab .p{color:var(--gold);width:1em}
  #playRoot .role{color:var(--gold)}
  #playRoot .game{display:grid;grid-template-columns:1fr 320px;gap:16px;
      max-width:1180px;margin:0 auto;padding:20px 16px 40px}
  #playRoot .bar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
      padding-bottom:10px;border-bottom:1px solid var(--line);font-size:13px}
  #playRoot .clock{color:var(--gold);font-size:17px;font-variant-numeric:tabular-nums}
  #playRoot .mini{margin-left:auto;background:none;border:1px solid var(--line);
      border-radius:2px;padding:4px 10px;font-size:12px;color:var(--dim)}
  #playRoot .mini:hover{border-color:var(--gold);color:var(--gold)}
  #playRoot .scene{margin:16px 0 20px}
  #playRoot .scene p{margin:0 0 12px}
  #playRoot .log{border-top:1px solid var(--line);padding-top:14px;
      max-height:46vh;overflow-y:auto;font-size:14px}
  #playRoot .l{margin:0 0 9px;color:var(--dim)}
  #playRoot .lt{display:inline-block;min-width:52px;color:#5f574c;font-size:12px;
      font-variant-numeric:tabular-nums}
  #playRoot .l-gain{color:var(--gold)}
  #playRoot .l-world{color:var(--warn)}
  #playRoot .l-talk, #playRoot .l-companion{color:var(--ink)}
  #playRoot .l-system{color:#6e665b;font-style:italic}
  #playRoot .right{display:flex;flex-direction:column;gap:12px}
  #playRoot .panel{background:var(--panel);border:1px solid var(--line);border-radius:2px;padding:14px}
  #playRoot .act{display:flex;justify-content:space-between;align-items:baseline;gap:10px;
      width:100%;text-align:left;background:none;border:1px solid var(--line);
      border-radius:2px;padding:9px 11px;margin-bottom:6px;font-size:14px}
  #playRoot .act:hover{border-color:var(--gold)}
  #playRoot .act.warn{border-color:#4a352a}
  #playRoot .cost{font-size:11px;color:var(--dim);white-space:nowrap}
  #playRoot .itm{margin:0 0 6px;font-size:13px}
  #playRoot .itm.lost{color:var(--warn);text-decoration:line-through}
  #playRoot .truth{background:var(--panel);border-left:2px solid var(--gold);padding:12px 16px}
  #playRoot .truth.hid{border-left-color:var(--line);color:var(--dim)}
  @media(max-width:900px) {
  #playRoot .game{grid-template-columns:1fr}
  #playRoot .log{max-height:30vh}
  }

  @media(max-width:1040px){
    .app{grid-template-columns:1fr}
    .side{position:static;max-height:none}
  }
</style>
</head>
<body>
<div id="app"></div>
<!-- 草稿：線上版靠這格帶著走。頁面自行改寫此處內容再整頁重發，就等於存檔。
     本機開啟時這裡是 null，改用 localStorage。 -->
<script id="draft" type="application/json">null</script>
<script id="bundle">/*BUNDLE*/</script>
</body>
</html>
