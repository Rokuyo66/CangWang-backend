<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>蒼望桌面小工具｜原型</title>
<style>
  /* 外框（原型的展示台）走宣紙那一套；小工具本身的色票由 JS 逐張灌 CSS 變數。 */
  :root{ --page:#EDE6D6; --pink:#3A322A; --pdim:#8A7C68; --pline:#DCD2BC; }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--page);color:var(--pink);
    font-family:"Noto Serif TC","Songti TC",serif;line-height:1.75}
  button{font-family:inherit;cursor:pointer}

  #app{max-width:1000px;margin:0 auto;padding:40px 24px 72px}
  h1{font-size:22px;letter-spacing:.14em;margin:0 0 4px;font-weight:500}
  .sub{margin:0 0 22px;font-size:13px;color:var(--pdim)}
  .note{margin:18px 0 0;font-size:12px;color:var(--pdim);line-height:1.9}

  .ctl{display:flex;flex-wrap:wrap;gap:20px;padding:14px 16px;margin-bottom:22px;
    border:1px solid var(--pline);border-radius:10px;background:#FFFDF8}
  .grp{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .lab{font-size:12px;color:var(--pdim);letter-spacing:.14em;margin-right:2px}
  .chip{background:none;border:1px solid var(--pline);border-radius:999px;
    padding:4px 12px;font-size:13px;color:var(--pink)}
  .chip:hover{border-color:#B08A4A}
  .chip.on{border-color:#B08A4A;color:#8A6A2E;background:#F7F1E2}
  .chip.lock{color:var(--pdim);border-style:dashed}

  .stage{display:flex;flex-wrap:wrap;align-items:flex-start;gap:28px;
    padding:32px;border-radius:14px;transition:background .2s}
  .cell{display:flex;flex-direction:column;gap:8px}
  .cap{font-size:11px;letter-spacing:.18em;color:rgba(0,0,0,.35);text-align:center}
  .stage .w.dark + .cap,.cell:has(.w.dark) .cap{color:rgba(255,255,255,.45)}

  .act{margin-top:20px;font-size:12px;color:var(--pdim);font-family:ui-monospace,monospace}

  /* ---------- 小工具本體 ---------- */
  .w{position:relative;overflow:hidden;border-radius:18px;
    background:var(--card);color:var(--ink);border:1px solid var(--line);
    box-shadow:0 6px 20px rgba(0,0,0,.14)}
  .w-s{width:176px;height:176px}
  .w-m{width:376px;height:176px}
  .w-l{width:376px;height:376px}

  /* 材質層（竹簡的直紋、青瓷的冰裂、硃砂的暈）壓在底圖與內容之間 */
  .w::after{content:"";position:absolute;inset:0;background:var(--texture);
    pointer-events:none}

  .bg{position:absolute;inset:0;display:flex;align-items:center;justify-content:flex-end;
    padding:0 4px 26px 0;pointer-events:none}
  .bg img{height:100%;max-width:58%;opacity:.11;object-fit:contain}
  .bgword{font-size:96px;letter-spacing:.06em;line-height:1;color:var(--ink);
    opacity:.075;writing-mode:vertical-rl;transform:translateX(6%)}
  .w-s .bgword{font-size:66px}
  .w-l .bgword{font-size:130px;opacity:.065}

  .body{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;
    padding:13px 15px 12px}
  .w-s .body{padding:11px 12px 11px}

  .top{flex:none;display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--dim);
    letter-spacing:.05em;white-space:nowrap}
  .w-s .top{flex-direction:column;gap:0;font-size:11px}
  .top .jq{color:var(--gold)}

  /* 中段：吃掉剩下的高度、靠下對齊、超出就切掉。小工具不能捲動，
     所以寧可少一行，也不能把底列那顆問卦鈕擠出畫面。 */
  .mid{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:flex-end;
    overflow:hidden}
  /* 大尺寸內容多半填不滿，靠下對齊會在小字底下開一個天窗，改置中 */
  .w-l .mid{justify-content:center}

  .head{display:flex;align-items:baseline;gap:9px}
  .stance{font-size:40px;letter-spacing:.1em;line-height:1.2;font-weight:500}
  .w-s .stance{font-size:34px}
  /* 中尺寸的行止字級是被高度逼出來的：176px 扣掉小字、底列與內距，
     中段只剩約 88px，要同時放得下行止與那句建議的兩行。 */
  .w-m .stance{font-size:34px}
  .w-l .stance{font-size:46px}
  .tier{font-size:11px;color:var(--gold);letter-spacing:.16em;
    border:1px solid var(--line);border-radius:999px;padding:1px 8px;white-space:nowrap}

  .line{font-size:13px;color:var(--dim);margin-top:4px;line-height:1.55;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .yj{display:flex;gap:13px;font-size:12px;margin-top:6px;letter-spacing:.04em;
    color:var(--gold);white-space:nowrap;overflow:hidden}
  .yj .ji{color:var(--dim)}

  .poem{margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}
  .qn{font-size:11px;color:var(--dim);letter-spacing:.06em;margin-bottom:4px}
  .pl{font-size:14px;letter-spacing:.14em;line-height:1.8}

  .u-word{font-size:34px;letter-spacing:.14em;color:var(--dim);line-height:1.25}
  /* 中尺寸未測時要塞下大字、一句引導與那條連結，字級與行數都得讓一步 */
  .w-m .u-word{font-size:30px}
  .w-m .u-line{-webkit-line-clamp:1}
  .w-l .u-word{font-size:40px}
  .u-line{font-size:12.5px;color:var(--dim);margin-top:3px;line-height:1.6;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cta{margin-top:5px;align-self:flex-start;background:none;border:none;padding:0;
    color:var(--gold);font-size:13px;letter-spacing:.08em}
  .cta:hover{text-decoration:underline}

  .foot{flex:none;display:flex;align-items:center;gap:8px;margin-top:11px}
  .sign{background:none;border:1px solid var(--line);color:var(--dim);
    border-radius:999px;padding:5px 11px;font-size:12px;letter-spacing:.08em;white-space:nowrap}
  .sign:hover{border-color:var(--gold);color:var(--gold)}
  .sign.on{border-color:var(--gold);color:var(--gold);opacity:.7}
  /* 問卦：整張小工具上最重的一塊顏色。它不標次數，就靠份量把人帶進去。 */
  .ask{flex:1;background:var(--seal);border:none;color:#FFF6EE;
    border-radius:10px;padding:8px 12px;font-size:15px;letter-spacing:.34em;
    text-indent:.34em;box-shadow:0 2px 8px rgba(0,0,0,.18)}
  .ask:hover{filter:brightness(1.08)}
  .w-s .ask{font-size:14px;padding:7px 6px;letter-spacing:.2em;text-indent:.2em}
</style>
</head>
<body>
<div id="app"></div>
<script>/*BUNDLE*/</script>
</body>
</html>
