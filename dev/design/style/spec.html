<title>幾知觀 美術規範</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style id="spec-style">
/* 版面：頂部固定工具列（主題切換＋存檔狀態）＋ 左側章節導覽 ＋ 右側內容。
   外框（--c-*）是固定的工作台色，不跟主題換；五套主題的色碼只作用在「預覽」裡（--paper、--ink … 掛在 body）。
   這份規範刻意單一外觀：畫的是幾知觀本身，不跟著瀏覽器的深淺色切換。 */
:root{
  --c-bg:#E9E5DD; --c-panel:#F8F6F1; --c-line:#D3CBBC; --c-ink:#1E1A16; --c-soft:#665D52; --c-faint:#978D7F;
  --c-accent:#8E3A2A; --c-ok:#3F6B45; --c-warn:#9A6B1F;
  --f-disp:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--c-bg);color:var(--c-ink);font-family:var(--f-body);font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--c-accent);outline-offset:2px}
code,.mono{font-family:var(--f-mono);font-size:12px}

/* ── 頂部工具列 ── */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(233,229,221,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid var(--c-line)}
.bar-in{max-width:1180px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column;line-height:1.3;margin-right:auto}
.brand b{font-family:var(--f-disp);font-size:17px;letter-spacing:.2em}
.brand small{font-size:11px;letter-spacing:.14em;color:var(--c-faint)}
.themes{display:flex;flex-wrap:wrap;gap:6px}
.th{display:flex;align-items:center;gap:6px;border:1px solid var(--c-line);background:var(--c-panel);border-radius:999px;padding:4px 12px 4px 5px;font-size:13px;letter-spacing:.08em}
.th i{width:18px;height:18px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:block}
.th[aria-pressed="true"]{border-color:var(--c-ink);background:var(--c-ink);color:var(--c-panel)}
.state{font-size:12px;letter-spacing:.06em;border-radius:999px;padding:4px 11px;border:1px solid var(--c-line);background:var(--c-panel);color:var(--c-soft);white-space:nowrap}
.state.dirty{border-color:var(--c-warn);color:var(--c-warn)}
.state.pend{border-color:var(--c-accent);color:var(--c-accent)}

/* ── 主體 ── */
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 120px;display:grid;grid-template-columns:170px minmax(0,1fr);gap:28px}
@media (max-width:860px){.wrap{grid-template-columns:minmax(0,1fr)}.nav{display:none}}
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);align-self:start;display:flex;flex-direction:column;gap:2px}
.nav a{color:var(--c-soft);text-decoration:none;font-size:13px;letter-spacing:.12em;padding:6px 10px;border-radius:8px;border-left:2px solid transparent}
.nav a:hover{color:var(--c-ink);background:var(--c-panel)}
main{min-width:0;display:flex;flex-direction:column;gap:44px}
.sec{display:flex;flex-direction:column;gap:16px;scroll-margin-top:90px}
.sec-k{font-size:11.5px;letter-spacing:.24em;color:var(--c-accent);font-weight:700}
.sec h2{font-family:var(--f-disp);font-size:24px;letter-spacing:.12em;margin:2px 0 0;text-wrap:balance}
.lead{margin:0;color:var(--c-soft);max-width:68ch}
.note{margin:0;font-size:12.5px;color:var(--c-faint);max-width:72ch}
.panel{background:var(--c-panel);border:1px solid var(--c-line);border-radius:14px;padding:16px}
.tbl{overflow-x:auto;border:1px solid var(--c-line);border-radius:12px;background:var(--c-panel)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--c-line);vertical-align:top}
th{font-size:11.5px;letter-spacing:.1em;color:var(--c-soft);font-weight:500;background:#F1EEE7;white-space:nowrap}
tr:last-child td{border-bottom:none}
td.num{font-family:var(--f-mono);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
.tag{display:inline-block;font-size:11px;letter-spacing:.06em;border-radius:999px;padding:0 8px;border:1px solid var(--c-line);color:var(--c-soft);white-space:nowrap}
.tag.app{border-color:#9DB4A0;color:#3F6B45;background:#EEF4EE}
.tag.web{border-color:#A9B5CB;color:#3E5580;background:#EEF1F7}
.tag.todo{border-color:#D8B38A;color:var(--c-warn);background:#FBF3E8}

/* ── 色彩：編輯列 ＋ 預覽 ── */
.color-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,420px);gap:18px;align-items:start}
@media (max-width:980px){.color-grid{grid-template-columns:minmax(0,1fr)}}
.tok-list{display:flex;flex-direction:column;gap:0}
.tok{display:grid;grid-template-columns:44px minmax(0,1fr) 150px;gap:4px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--c-line)}
.tok:last-child{border-bottom:none}
.tok-sw{position:relative;width:44px;height:44px;border-radius:10px;border:1px solid rgba(0,0,0,.14);overflow:hidden;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%,transparent 75%,#ddd 75%),linear-gradient(45deg,#ddd 25%,transparent 25%,transparent 75%,#ddd 75%);background-size:10px 10px;background-position:0 0,5px 5px}
.tok-sw span{position:absolute;inset:0}
.tok-sw input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:none;padding:0}
.tok-name{min-width:0}
.tok-name b{font-size:14px;letter-spacing:.06em}
.tok-name code{color:var(--c-faint);margin-left:6px}
.tok-name p{margin:0;font-size:12px;color:var(--c-soft);line-height:1.6}
.tok-val{display:flex;flex-direction:column;gap:4px;align-items:stretch}
.tok-val input[type=text]{font-family:var(--f-mono);font-size:12px;border:1px solid var(--c-line);border-radius:7px;padding:5px 7px;background:#fff;width:100%}
.tok-val .alpha{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--c-faint)}
.tok-val .alpha input{flex:1;min-width:0;accent-color:var(--c-accent)}
.tok.changed .tok-name b::after{content:"已改";margin-left:8px;font-size:10.5px;letter-spacing:.1em;color:var(--c-warn);border:1px solid currentColor;border-radius:999px;padding:0 6px;vertical-align:2px}
.reset1{font-size:11px;color:var(--c-faint);background:none;border:none;padding:0;text-align:right;text-decoration:underline}
.grp-h{font-size:12px;letter-spacing:.16em;color:var(--c-soft);margin:14px 0 2px}
.grp-h:first-child{margin-top:0}

/* 全主題總覽 */
.matrix td{padding:6px 10px}
.mx{display:inline-block;width:26px;height:18px;border-radius:5px;border:1px solid rgba(0,0,0,.12);vertical-align:middle}
.mx-hex{font-family:var(--f-mono);font-size:11px;color:var(--c-soft);margin-left:6px}

/* ══ 預覽：這一塊吃主題色碼（--paper、--ink …）══ */
.pv{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px);border-radius:16px;overflow:hidden;border:1px solid var(--c-line);box-shadow:0 10px 30px rgba(40,30,20,.12)}
@media (max-width:980px){.pv{position:static}}
.pv-page{background:radial-gradient(120% 90% at 50% -10%, color-mix(in srgb,var(--paper) 88%,#fff) 0%, var(--paper) 46%, var(--paper-2) 100%);color:var(--ink);font-family:var(--f-disp);padding:16px 18px 20px;display:flex;flex-direction:column;gap:14px}
.pv-top{display:flex;align-items:center;gap:8px}
.pv-date{font-size:12px;color:var(--ink-faint);letter-spacing:.06em;margin-right:auto}
.pv-mail{position:relative;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--hair);color:var(--ink-faint)}
.pv-mail svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6}
.reddot{position:absolute;top:-3px;right:-3px;width:9px;height:9px;border-radius:50%;background:var(--cinnabar);box-shadow:0 0 0 2px var(--paper)}
.lingshi{font-size:14px;letter-spacing:.06em;color:var(--ink);background:var(--paper-2);border:1px solid var(--paper-edge);border-radius:30px;padding:6px 12px;display:inline-flex;align-items:center;gap:4px;line-height:16px}
.lingshi b{color:var(--cinnabar);font-weight:700}
.pv-h{font-size:20px;font-weight:700;letter-spacing:.14em}
.pv-sub{font-size:12.5px;color:var(--ink-soft);letter-spacing:.04em;margin-top:-8px}
.pv-card{background:var(--paper-2);border:1px solid var(--paper-edge);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.pv-card b{font-size:14.5px;letter-spacing:.06em}
.pv-card span{font-size:12.5px;color:var(--ink-soft)}
.pv-card small{font-size:11.5px;color:var(--gold);letter-spacing:.08em}
.pv-hair{height:1px;background:var(--hair)}
.pv-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.pv-wx{display:flex;flex-wrap:wrap;gap:6px}
.pv-wx span{font-size:11.5px;letter-spacing:.08em;padding:1px 9px;border-radius:999px;border:1px solid currentColor}
.pv-faint{font-size:12px;color:var(--ink-faint)}
.pv-accent{color:var(--cinnabar);font-weight:700}

/* 頁籤（同站上 .tag-tabs） */
.tag-tabs{display:flex;gap:6px;position:relative;isolation:isolate}
.tag-tab{flex:1 1 0;min-width:0;text-align:center;position:relative;font-family:var(--f-disp);font-size:13.5px;letter-spacing:.12em;text-indent:.12em;padding:7px 0;border:1px solid transparent;border-radius:30px;background:transparent;color:var(--ink-faint);transition:color .2s}
.tag-tab::before{content:"";position:absolute;inset:-1px;z-index:-2;border-radius:inherit;background:var(--paper-2)}
.tag-tab.on{color:var(--paper);font-weight:500}
.m-pill{position:absolute;left:0;top:0;z-index:-1;border-radius:30px;background:var(--ink);pointer-events:none}

/* 頂列膠囊（站上 .topbtn）：沒有厚度 */
.topbtn{font-family:var(--f-disp);font-size:12px;letter-spacing:.14em;color:var(--ink-soft);background:transparent;border:1px solid var(--hair);border-radius:30px;padding:6px 12px;line-height:17px}
.topbtn:hover{border-color:var(--cinnabar);color:var(--cinnabar)}

/* ══ 按鈕：一塊有厚度的東西 ══
   面（--bf）、框（--bb）、側邊（--be）、字（--bt）四個色由 --b-<型>-* 給；
   連動時它們是色碼的算式，斷開時是單獨設的色。厚度 --bd，按下吃掉厚度。 */
.b{--bd:3.6px;--press:0;font-family:var(--f-disp);font-size:14px;letter-spacing:.14em;font-weight:500;border-radius:30px;padding:11px 22px;line-height:1.4;
  background:var(--bf);color:var(--bt);border:1px solid var(--bb);
  translate:0 calc(var(--bd) * var(--press));
  box-shadow:0 calc(var(--bd) * (1 - var(--press))) 0 var(--be), 0 calc((var(--bd) * 1.6 + 2px) * (1 - var(--press))) calc(var(--bd) * 2.5 + 4px) color-mix(in srgb, var(--shadow) calc(100% * (1 - var(--press))), transparent);
  transition:translate .28s cubic-bezier(.34,1.56,.64,1), box-shadow .28s cubic-bezier(.34,1.56,.64,1), background-color .2s, color .2s, border-color .2s;
  -webkit-tap-highlight-color:transparent;user-select:none}
.b:active,.b.down{--press:1;transition-duration:.09s;transition-timing-function:cubic-bezier(.22,1,.36,1)}
.b.primary{--bf:var(--b-primary-face);--bb:var(--b-primary-border);--be:var(--b-primary-edge);--bt:var(--b-primary-text)}
.b.second{--bf:var(--b-second-face);--bb:var(--b-second-border);--be:var(--b-second-edge);--bt:var(--b-second-text)}
.b.text{--bf:var(--b-text-face);--bb:var(--b-text-border);--be:var(--b-text-edge);--bt:var(--b-text-text)}
.b.text:hover{--bb:var(--cinnabar);--bt:var(--cinnabar)}
.b.danger{--bf:var(--b-danger-face);--bb:var(--b-danger-border);--be:var(--b-danger-edge);--bt:var(--b-danger-text)}
.b.sm{font-size:13px;padding:8px 14px}
@media (prefers-reduced-motion:reduce){.b{transition:none;translate:none}}

.btn-types{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.bt-card{display:flex;flex-direction:column;gap:10px}
.bt-stage{border-radius:12px;padding:22px 12px 26px;display:flex;justify-content:center;align-items:center;background:var(--paper);border:1px solid var(--c-line)}
.bt-card h3{margin:0;font-family:var(--f-disp);font-size:15px;letter-spacing:.1em}
.bt-card p{margin:0;font-size:12.5px;color:var(--c-soft)}
.anat{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;font-size:12px;align-items:center}
/* 兩段開關（時序｜月曆）的示範：吃 --b-seg-*，與前端 motion.css 的 --seg-* 一一對應 */
.seg-demo{display:inline-flex;gap:2px;padding:3px;border:1px solid var(--paper-edge);border-radius:999px;background:var(--b-seg-track);box-shadow:inset 0 2px 3px var(--b-seg-groove)}
.seg-demo button{border:none;background:transparent;color:var(--b-seg-off);font-size:12.5px;letter-spacing:.1em;padding:5px 14px;border-radius:999px;transition:background .2s,color .2s,transform .2s}
.seg-demo button.on{background:var(--b-seg-knob);color:var(--b-seg-on);box-shadow:0 2.2px 0 var(--b-seg-knob-edge),0 4px 6px var(--shadow);transform:translateY(-1.1px)}
.anat i{width:16px;height:16px;border-radius:4px;border:1px solid rgba(0,0,0,.14);display:block}
.anat span{color:var(--c-soft)}
.anat input[type=color]{width:34px;height:22px;padding:0;border:1px solid var(--c-line);border-radius:5px;background:none}
.link-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.switch{display:inline-flex;align-items:center;gap:10px;font-size:13.5px;cursor:pointer}
.switch input{width:40px;height:22px;appearance:none;-webkit-appearance:none;border-radius:999px;background:#CFC7B8;position:relative;cursor:pointer;transition:background .2s}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:translate .2s}
.switch input:checked{background:var(--c-ok)}
.switch input:checked::after{translate:18px 0}

/* 場景層（不隨主題）的樣本 */
.scene-sample{background:#0d0b08;color:#ECE3D3;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px;font-family:var(--f-disp)}
.scene-sample .spk{font-weight:700;color:#fff}
.scene-sample .spk small{font-weight:400;font-size:11px;color:rgba(236,227,211,.58);margin-left:6px}
.scene-sample .pill{align-self:flex-start;font-size:12.5px;letter-spacing:.14em;border:1px solid rgba(236,227,211,.8);border-radius:20px;padding:7px 12px;background:rgba(0,0,0,.35)}
/* 選項：同動態規範「事件對話幕」（前端 .sc-center .sc-choice）——只有上下框線、兩側淡出、字置中 */
.scene-sample .ch{display:flex;flex-direction:column;justify-content:center;min-height:49px;padding:5px 14px 4px;text-align:center;font-size:14.5px;font-weight:600;
  border:0;border-top:1px solid;border-bottom:1px solid;border-image:linear-gradient(90deg,transparent 0,rgba(201,168,106,.55) 10%,rgba(201,168,106,.55) 90%,transparent 100%) 1;
  background:linear-gradient(90deg,rgba(201,168,106,0) 0,rgba(13,11,8,.6) 10%,rgba(0,0,0,.9) 50%,rgba(0,0,0,.7) 90%,rgba(201,168,106,0) 100%)}
.scene-sample .ch small{font-size:12px;font-weight:400;color:#D8B578}
.scene-sample .line{font-size:14px;line-height:1.9}

/* ── 版面：手機框示意 ── */
.phones{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
.phone{width:220px;max-width:100%;border-radius:26px;border:7px solid #1c1814;background:var(--paper);overflow:hidden;display:flex;flex-direction:column;height:420px;flex:none}
.phone .ph-top{height:40px;display:flex;align-items:center;gap:6px;padding:0 var(--pad);font-size:9px;color:var(--ink-faint);border-bottom:1px solid var(--hair)}
.phone .ph-body{flex:1;padding:12px var(--pad);display:flex;flex-direction:column;gap:8px;position:relative}
.phone .ph-body::before,.phone .ph-body::after{content:"";position:absolute;top:0;bottom:0;width:var(--pad);background:repeating-linear-gradient(45deg,rgba(142,58,42,.16) 0 4px,transparent 4px 8px)}
.phone .ph-body::before{left:0}.phone .ph-body::after{right:0}
.phone .ph-card{height:44px;border-radius:8px;background:var(--paper-2);border:1px solid var(--paper-edge)}
.phone .ph-tab{height:var(--tab);border-top:1px solid var(--hair);display:flex;justify-content:space-around;align-items:center;font-size:9px;color:var(--ink-faint)}
.ph-cap{font-size:12px;color:var(--c-soft);margin-top:8px;max-width:220px}

/* ── 動態：嵌進來的動態規範 ── */
.motion-frame{width:100%;height:80vh;min-height:560px;border:1px solid var(--c-line);border-radius:14px;background:var(--paper)}

/* ── 待套用 ── */
.pending{display:flex;flex-direction:column;gap:10px}
.chg{font-size:13px;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:6px 0;border-bottom:1px dashed var(--c-line)}
.chg .from,.chg .to{font-family:var(--f-mono);font-size:12px;display:inline-flex;align-items:center;gap:5px}
.chg .from{color:var(--c-faint);text-decoration:line-through}
.chg i{width:12px;height:12px;border-radius:3px;border:1px solid rgba(0,0,0,.15);display:inline-block}
pre.brief{margin:0;white-space:pre-wrap;word-break:break-word;background:#1d1a16;color:#EDE6D8;border-radius:10px;padding:14px;font-family:var(--f-mono);font-size:12px;line-height:1.7;max-height:320px;overflow:auto}
.ghost{border:1px solid var(--c-line);background:var(--c-panel);border-radius:999px;padding:6px 14px;font-size:13px}
.ghost:hover{border-color:var(--c-ink)}
.solid{border:1px solid var(--c-ink);background:var(--c-ink);color:var(--c-panel);border-radius:999px;padding:7px 16px;font-size:13px}
.danger-l{color:var(--c-accent)}

/* 未存檔提示條 */
.savebar{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));translate:-50% 0;z-index:40;background:#1E1A16;color:#F4EFE6;border-radius:999px;padding:8px 8px 8px 18px;display:flex;align-items:center;gap:10px;box-shadow:0 12px 30px rgba(0,0,0,.28);max-width:calc(100% - 32px);font-size:13.5px}
.savebar[hidden]{display:none}
.savebar .solid{background:#F4EFE6;color:#1E1A16;border-color:#F4EFE6}
.savebar .ghost{background:transparent;color:#F4EFE6;border-color:rgba(244,239,230,.35)}
/* 確認框 */
.dlg{position:fixed;inset:0;z-index:50;background:rgba(20,16,12,.45);display:grid;place-items:center;padding:16px}
.dlg[hidden]{display:none}
.dlg-card{background:var(--c-panel);border-radius:16px;max-width:520px;width:100%;padding:22px;display:flex;flex-direction:column;gap:12px;max-height:86vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.dlg-card h3{margin:0;font-family:var(--f-disp);font-size:18px;letter-spacing:.1em}
.dlg-row{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;translate:-50% 0;z-index:60;background:#1E1A16;color:#F4EFE6;border-radius:999px;padding:8px 18px;font-size:13px}
.toast[hidden]{display:none}

/* ── 墊圖：頁面最上面那張襯底的場景圖（站上 styles/hall.css 的 .hall-bg）──
   手機框裡照站上的 CSS 像素畫（390 寬），再整個縮小擺進來：圖帶高 560、字級、留白都是真的數字，看到的比例就是站上的比例。 */
.bd-grid{display:grid;grid-template-columns:minmax(0,320px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:980px){.bd-grid{grid-template-columns:minmax(0,1fr)}}

/* ══ 通用 TAG 頁籤（前端 .tag-tabs／.tag-tab ＋ motion.js 的 .m-pill，同一組數字） ══ */
.tg-std{display:inline-flex;align-items:center;gap:6px;font-family:var(--sans);font-size:11px;letter-spacing:.14em;font-weight:700;color:var(--paper-2);background:var(--ink);border-radius:999px;padding:3px 10px 3px 9px}
.tg-std::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--cinnabar)}
.tg-box{background:var(--paper);border:1px solid var(--paper-edge);border-radius:14px;padding:18px 20px 16px;display:flex;flex-direction:column;gap:10px}
.tg-cap{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-family:var(--sans);font-size:11.5px;color:var(--ink-faint);letter-spacing:.06em}
.tg-cap b{color:var(--ink-soft);font-weight:500;letter-spacing:.1em}
.tag-tabs{display:flex;flex-wrap:nowrap;gap:6px;position:relative;isolation:isolate}
.tag-tab{flex:1 1 0;min-width:0;text-align:center;position:relative;font-family:var(--serif);font-size:13.5px;letter-spacing:.12em;text-indent:.12em;cursor:pointer;padding:7px 0;border:1px solid transparent;border-radius:999px;background:transparent;color:var(--ink-faint);font-weight:400;transition:color var(--t-quick) ease;-webkit-tap-highlight-color:transparent}
/* 未選的淡底畫在 ::before、墊在底塊下面：底塊滑過時蓋得住它，格子本身不做按壓縮放 */
.tag-tab::before{content:"";position:absolute;inset:-1px;z-index:-2;border-radius:inherit;background:var(--paper-2)}
.tag-tab.on{color:var(--paper-2);font-weight:500}
.tag-tab small{font-size:10.5px;opacity:.6;margin-left:3px}
.tag-tabs.tag-fit{flex-wrap:wrap}
.tag-tabs.tag-fit>.tag-tab{flex:none;padding:7px 14px}
.m-pill{position:absolute;left:0;top:0;z-index:-1;border-radius:999px;background:var(--ink);pointer-events:none}
.tg-spec{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tg-spec div{background:var(--paper-2);border:1px solid var(--paper-edge);border-radius:10px;padding:10px 12px;font-family:var(--sans);font-size:12px;line-height:1.6;color:var(--ink-soft)}
.tg-spec b{display:block;font-size:11px;letter-spacing:.12em;color:var(--ink-faint);font-weight:500}
.tg-sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px;border:1px solid var(--paper-edge)}

/* 切換開關：滑塊擠壓伸展 */
.toggle{width:60px;height:34px;border-radius:999px;background:#D9CFBC;border:none;position:relative;padding:0;transition:background var(--t-quick) ease;box-shadow:inset 0 2px 3px rgba(40,28,14,.18)}
.toggle i{position:absolute;top:4px;left:4px;width:26px;height:26px;border-radius:50%;background:var(--paper-2);box-shadow:0 2px 0 var(--paper-edge),0 3px 6px var(--shade);transition:translate var(--t-release) var(--e-spring)}
.toggle.on{background:var(--cinnabar)}
.toggle.on i{translate:26px 0}
.toggle.moving i{animation:squash var(--t-release) var(--e-out)}
@keyframes squash{0%{scale:1 1}35%{scale:1.35 .82}100%{scale:1 1}}

/* ══════════ B 容器轉場 ══════════ */
.scrim{position:fixed;inset:0;background:rgba(24,18,12,.42);z-index:80;display:grid;place-items:center;padding:16px;animation:fade-in var(--t-enter) var(--e-out) both}
.scrim.out{animation:fade-out var(--t-exit) var(--e-in) both}
@keyframes fade-in{from{opacity:0}}
@keyframes fade-out{to{opacity:0}}
.dialog{width:min(340px,100%);background:var(--paper-2);border-radius:18px;padding:24px 22px 20px;box-shadow:0 5px 0 var(--paper-edge),0 24px 60px rgba(24,18,12,.35);transform-origin:50% 70%;animation:dlg-in var(--t-enter) var(--e-spring) both}
.scrim.out .dialog{animation:dlg-out var(--t-exit) var(--e-in) both}
@keyframes dlg-in{0%{opacity:0;transform:perspective(900px) translateY(28px) rotateX(16deg) scale(.9)}45%{opacity:1}100%{transform:perspective(900px) translateY(0) rotateX(0) scale(1)}}
@keyframes dlg-out{to{opacity:0;transform:perspective(900px) translateY(10px) rotateX(-8deg) scale(.95)}}
.dialog > *{animation:rise var(--t-enter) var(--e-out) both;animation-delay:calc(var(--t-quick) * .5 + var(--stagger) * var(--i,0))}
.scrim.out .dialog > *{animation:none}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
.dialog h4{margin:0 0 8px;font-size:18px;letter-spacing:.1em}
/* ── 對話彈窗：一位角色說話、玩家用罐頭句回（前端 #guideModal ＝ .guide-card） ── */
.dialog.talk{width:min(420px,100%);text-align:left;padding:20px 22px 16px}
.talk-head{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.talk-ava{width:44px;height:44px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:19px;background:var(--paper);border:1px solid var(--paper-edge)}
.talk-who{display:flex;flex-direction:column;line-height:1.35}
.talk-who b{font-size:14.5px;letter-spacing:.08em}
.talk-who span{font-size:11px;color:var(--ink-faint);letter-spacing:.1em}
.talk-step{margin-left:auto;font-size:11px;color:var(--ink-faint);letter-spacing:.1em}
.talk-title{font-size:13px;color:var(--cinnabar);letter-spacing:.14em;margin-bottom:8px}
.talk-say{font-size:14px;line-height:2;letter-spacing:.05em;white-space:pre-line;background:var(--paper);border:1px solid var(--paper-edge);border-radius:12px;padding:14px 16px;min-height:120px}
.talk-acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:14px}
.talk-acts .btn{border-radius:999px}
.talk-skip{display:block;margin:12px auto 0;background:none;border:0;cursor:pointer;font-family:inherit;font-size:11px;letter-spacing:.1em;color:var(--ink-faint)}
.talk-skip:hover{color:var(--cinnabar)}
.rev-demo{background:var(--paper-2);border:1px solid var(--paper-edge);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.rev-row{display:flex;gap:6px}.rev-row span{flex:1;text-align:center;border:1px solid var(--paper-edge);border-radius:999px;padding:5px 0;font-size:12.5px;color:var(--ink-soft)}
.rev-row span.on{border-color:var(--cinnabar);color:var(--cinnabar)}
.rev-demo .btn{padding:8px 0;font-size:13.5px}
.scrim.morph .dialog{animation:none}
.scrim.morph .talk-body > *{animation-delay:calc(var(--t-page) * .7 + var(--stagger) * var(--i,0))}
.talk-body > *{animation:rise var(--t-enter) var(--e-out) both;animation-delay:calc(var(--stagger) * var(--i,0))}
.dialog p{margin:0 0 18px;font-size:14px;line-height:1.8;color:var(--ink-soft)}
.dialog .row{display:flex;gap:10px;justify-content:flex-end}
.dialog .btn{padding:10px 20px;font-size:14px}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 16px);z-index:90;background:var(--ink);color:var(--paper-2);font-family:var(--sans);font-size:13.5px;letter-spacing:.06em;border-radius:999px;padding:10px 20px;box-shadow:0 10px 26px rgba(24,18,12,.3);translate:-50% 0;animation:toast-in var(--t-enter) var(--e-spring) both}
.toast.out{animation:toast-out var(--t-exit) var(--e-in) both}
@keyframes toast-in{from{opacity:0;transform:translateY(-120%) scale(.9)}}
@keyframes toast-out{to{opacity:0;transform:translateY(-60%) scale(.96)}}

/* 手機框：頁面切換 */
.phone-row{display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start}
.phone{width:300px;max-width:100%;height:540px;border-radius:30px;overflow:hidden;position:relative;background:var(--paper);box-shadow:0 0 0 8px #1c1814,0 20px 50px rgba(40,28,14,.3);flex:none}
.pg{position:absolute;inset:0;background:var(--paper);display:flex;flex-direction:column;will-change:transform}
.pg-top{height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;border-bottom:1px solid var(--hair);font-size:15px;letter-spacing:.12em;font-weight:700;flex:none}
.pg-top button{border:none;background:none;font-size:18px;padding:4px 6px;margin-left:-6px}
.pg-list{padding:14px;display:flex;flex-direction:column;gap:12px;overflow:hidden}
.pg-list .card-p{width:100%;--dk:.75}
.pg-detail .hero{height:170px;background:linear-gradient(160deg,#E9C7BE,#F3EAD3);display:grid;place-items:center;font-size:44px;color:var(--cinnabar);font-weight:700;flex:none}
.pg-detail .txt{padding:16px;font-size:13.5px;line-height:1.9;color:var(--ink-soft)}
.pg-detail .txt b{display:block;color:var(--ink);font-size:16px;letter-spacing:.08em;margin-bottom:4px}
.pg.sheet{top:auto;height:62%;border-radius:18px 18px 0 0;box-shadow:0 -8px 30px rgba(24,18,12,.25)}
.pg.sheet .grab{width:40px;height:5px;border-radius:3px;background:var(--paper-edge);margin:8px auto 0}
.dim{position:absolute;inset:0;background:#0d0b08;opacity:0;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--sans);font-size:12.5px;letter-spacing:.05em;border:1px solid var(--paper-edge);background:var(--paper-2);border-radius:999px;padding:6px 13px;--dk:.5;--edge:var(--paper-edge)}
.chip.on{background:var(--ink);color:var(--paper-2);--edge:#000}
.trans-info{flex:1;min-width:240px;display:flex;flex-direction:column;gap:14px}

/* ── 引導聚光（前端 src/ui/coach.js、styles/coach.css）── */
.co-pg{position:absolute;inset:0;padding:70px 22px 0;display:flex;flex-direction:column;align-items:center;gap:16px;text-align:center}
.co-pg h4{margin:0;font-size:22px;letter-spacing:.2em}
.co-q{width:100%;border-bottom:1px solid var(--hair);padding:10px 0;color:var(--ink-faint);font-size:14px}
.co-seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:var(--app-paper-2);font-size:12.5px}
.co-seg span{padding:6px 12px;border-radius:999px}.co-seg span:first-child{background:var(--ink);color:var(--paper-2)}
.co-cast{padding:10px 40px;border-radius:999px;background:var(--ink);color:var(--paper-2);letter-spacing:.4em;font-size:14px}
.co-ring{position:absolute;border-radius:12px;pointer-events:none;box-shadow:0 0 0 200vmax rgba(20,16,10,.5);outline:2px solid var(--gold);
  transition:left var(--t-enter) var(--e-out),top var(--t-enter) var(--e-out),width var(--t-enter) var(--e-out),height var(--t-enter) var(--e-out)}
.co-card{position:absolute;left:12px;right:12px;bottom:12px;background:var(--paper);border:1px solid var(--paper-edge);border-radius:14px;
  box-shadow:0 10px 30px var(--shade);padding:12px 14px;text-align:left}
.co-card.top{bottom:auto;top:12px}
.co-card.in > *{animation:co-rise var(--t-enter) var(--e-out) both}
.co-card.in > :nth-child(2){animation-delay:var(--stagger)}.co-card.in > :nth-child(3){animation-delay:calc(var(--stagger)*2)}
@keyframes co-rise{from{opacity:0;transform:translateY(8px)}}
.co-head{display:flex;align-items:center;gap:8px;font-size:13px;margin-bottom:6px}
.co-head i{width:24px;height:24px;border-radius:50%;background:var(--c-f);display:inline-block}
.co-head small{color:var(--ink-faint);font-size:10.5px;letter-spacing:.1em}
.co-head .sk{margin-left:auto;color:var(--ink-faint);font-size:11.5px;letter-spacing:.12em}
.co-txt{font-size:13px;line-height:1.75}
.co-acts{display:flex;justify-content:flex-end;margin-top:8px}

/* ── 事件對話幕（前端 src/ui/scene.js＋styles/scene.css、story.css；角色事件與江湖共用）──
   這一層自成一個場景：墨底 #0d0b08、暖白字 #ECE3D3、金 #C9A86A，不跟主題換色。數字照 Figma「事件」與前端現行值。 */
.evx{position:absolute;inset:0;overflow:hidden;background:#0d0b08;color:#ECE3D3;font-family:var(--serif);cursor:pointer;-webkit-tap-highlight-color:transparent}
.evx-bg{position:absolute;inset:0;background:radial-gradient(120% 70% at 50% 30%,#5b4a36 0%,#2b2219 55%,#120e0a 100%);filter:blur(1.5px);transform:scale(1.02)}
.evx-por{position:absolute;left:18%;right:18%;top:14%;bottom:0;border-radius:46% 46% 0 0/30% 30% 0 0;background:linear-gradient(#3a3026,#1a140f 70%);opacity:0;transform:translateY(8px);transition:opacity .5s ease,transform .5s ease}
.evx-por::before{content:"";position:absolute;left:34%;right:34%;top:6%;aspect-ratio:1;border-radius:50%;background:#4a3d30}
.evx-por.on{opacity:.9;transform:none}
.evx-veil{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to bottom,rgba(13,11,8,.55) 0%,rgba(13,11,8,.06) 22%,rgba(13,11,8,.06) 62%,rgba(13,11,8,.4) 100%)}
.evx-top{position:absolute;top:10px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:flex-start;z-index:3;isolation:isolate}
.evx-top::before{content:"";position:absolute;z-index:-1;left:-12px;top:-10px;width:252px;height:96px;pointer-events:none;background:radial-gradient(246px 92px at 32px 21px,rgba(7,6,6,.7) 34%,rgba(102,102,102,.2) 70%,rgba(102,102,102,0) 90%)}
.evx-cap{display:flex;flex-direction:column;gap:3px;padding:5px 0 0 3px}
.evx-cap b{font-size:13px;letter-spacing:2px;text-shadow:0 2px 1px rgba(0,0,0,.5)}
.evx-where{display:inline-flex;align-items:center;gap:4px;font-size:12px;letter-spacing:2px;color:#C9A86A;text-shadow:0 1px 1px rgba(0,0,0,.5)}
.evx-where svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8}
.evx-acts{display:flex;gap:6px;align-items:center;height:32px}
.evx-acts span{height:32px;display:inline-flex;align-items:center;font-size:12px;letter-spacing:.14em;padding:0 12px;border-radius:999px;border:1px solid rgba(236,227,211,.5);background:rgba(0,0,0,.5)}
.evx-acts i{width:32px;height:32px;display:grid;place-items:center;font-style:normal;font-size:13px;opacity:.8}
.evx-deck{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;flex-direction:column;gap:10px;padding:36px 20px 18px;min-height:34%;
  background:linear-gradient(to bottom,rgba(13,11,8,0) 0%,rgba(13,11,8,.6) 12%,rgba(13,11,8,.9) 36%,rgba(13,11,8,.96) 100%);transition:opacity .3s}
.evx.talk .evx-deck{top:64%;min-height:0;padding-top:52px}
.evx-echo{position:absolute;top:8px;left:20px;right:20px;font-size:13px;line-height:1.6;opacity:.62;color:rgba(236,227,211,.85)}
.evx-echo::before{content:"你　";color:#C9A86A}
.evx-echo:empty{display:none}
.evx-spk{font-size:14px;font-weight:700;color:#fff;display:flex;align-items:baseline;gap:8px;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.evx-spk:empty{display:none}
.evx-spk small{font-weight:400;font-size:11px;letter-spacing:.12em;color:rgba(236,227,211,.58)}
.evx-line{font-size:14px;line-height:1.9;letter-spacing:.04em;white-space:pre-wrap;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.evx-line.narr{font-size:13.5px;color:rgba(236,227,211,.58);text-align:center;letter-spacing:.16em}
.evx-caret{display:inline-block;width:.5em;opacity:.75;animation:evx-blink 1s steps(2) infinite}
@keyframes evx-blink{50%{opacity:0}}
.evx-next{align-self:flex-end;margin-top:auto;font-size:12px;letter-spacing:.2em;color:rgba(236,227,211,.58);opacity:0;transition:opacity .3s}
.evx-next.on{opacity:1;animation:evx-bob 1.6s ease-in-out infinite}
@keyframes evx-bob{50%{transform:translateY(3px)}}
.evx-center{position:absolute;inset:0;z-index:4;display:none;align-items:center;justify-content:center;padding:0 20px}
.evx-center.on{display:flex}
.evx-chs{width:100%;max-width:440px;display:grid;gap:8px}
.evx-ch{--ln:rgba(201,168,106,.55);display:flex;flex-direction:column;justify-content:center;min-height:49px;padding:5px 14px 4px;text-align:center;color:#ECE3D3;font-family:inherit;cursor:pointer;
  border:0;border-top:1px solid;border-bottom:1px solid;border-image:linear-gradient(90deg,transparent 0,var(--ln) 10%,var(--ln) 90%,transparent 100%) 1;
  background:linear-gradient(90deg,rgba(201,168,106,0) 0,rgba(13,11,8,.6) 10%,rgba(0,0,0,.9) 50%,rgba(0,0,0,.7) 90%,rgba(201,168,106,0) 100%)}
.evx-ch b{font-size:14.5px;font-weight:600;line-height:21px;letter-spacing:.05em}
.evx-ch span{font-size:12px;line-height:17px;color:#D8B578}
.evx-ch:hover{--ln:rgba(201,168,106,.95)}
.evx-ch.off{opacity:.42;cursor:not-allowed}.evx-ch.off span{color:#d9a08f}
.evx-cut{position:absolute;inset:0;z-index:5;background:#0d0b08;display:flex;align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:opacity .38s ease}
.evx-cut.on{opacity:1}
.evx.done .evx-deck{opacity:0}
.evx.done .evx-cut{opacity:1;background:rgba(13,11,8,.5)}
.evx-place{font-size:16px;letter-spacing:.6em;text-indent:.6em;color:#C9A86A;opacity:0;transform:translateY(6px);transition:opacity .5s ease,transform .5s ease;white-space:nowrap}
.evx-place.on{opacity:1;transform:none}
.evx-place::before,.evx-place::after{content:"";display:inline-block;width:28px;height:1px;vertical-align:middle;background:rgba(201,168,106,.45);margin:0 14px}

/* ══════════ D 待機生命 ══════════ */
.icons{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.ic{background:var(--paper-2);border:1px solid var(--paper-edge);border-radius:14px;padding:14px 12px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;-webkit-tap-highlight-color:transparent}
.ic .box{width:84px;height:84px;position:relative;display:grid;place-items:center}
.ic .nm{font-size:14px;letter-spacing:.1em;font-weight:700}
.ic .meta{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.ic .how{font-family:var(--sans);font-size:11px;color:var(--ink-faint);text-align:center;line-height:1.5}

/* 共用：影子（2D→3D 的地面） */
.shadow{position:absolute;left:50%;bottom:6px;width:40px;height:8px;margin-left:-20px;border-radius:50%;background:rgba(40,28,14,.28);filter:blur(1px)}

/* 呼吸：印 */
.i-seal{width:50px;height:50px;border-radius:12px;background:var(--cinnabar);color:var(--paper-2);display:grid;place-items:center;font-size:22px;font-weight:700;rotate:-4deg;box-shadow:0 3px 0 var(--cinnabar-edge);animation:breathe var(--idle-m) var(--e-breath) infinite}
@keyframes breathe{50%{scale:calc(1 + var(--amp-scale));box-shadow:0 3px 0 var(--cinnabar-edge),0 0 calc(18px * var(--a)) rgba(181,64,46,.45)}}

/* 擺盪：燈（流蘇延遲跟隨＝附屬動作） */
.i-lantern{position:relative;width:40px;height:74px;transform-origin:50% 0;animation:swing var(--idle-m) var(--e-breath) infinite alternate}
.i-lantern .str{position:absolute;left:19px;top:0;width:2px;height:12px;background:var(--ink-soft)}
.i-lantern .body{position:absolute;left:2px;top:12px;width:36px;height:40px;border-radius:14px;background:radial-gradient(circle at 40% 35%,#E0715C,var(--cinnabar) 60%,var(--cinnabar-edge));box-shadow:inset 0 0 0 2px rgba(0,0,0,.08)}
.i-lantern .body::before,.i-lantern .body::after{content:"";position:absolute;left:8px;right:8px;height:4px;background:var(--gold);border-radius:2px}
.i-lantern .body::before{top:-2px}.i-lantern .body::after{bottom:-2px}
.i-lantern .tassel{position:absolute;left:18px;top:52px;width:4px;height:18px;background:var(--gold);border-radius:2px;transform-origin:50% 0;animation:swing var(--idle-m) var(--e-breath) infinite alternate;animation-delay:calc(var(--idle-m) * -.2)}
@keyframes swing{from{rotate:calc(var(--amp-rot) * -1)}to{rotate:var(--amp-rot)}}

/* 翻面：銅錢（拋起＋翻轉＋影子縮放） */
.i-coin{width:48px;height:48px;position:relative;perspective:260px;animation:toss var(--idle-m) var(--e-out) infinite}
.i-coin .flip{position:absolute;inset:0;transform-style:preserve-3d;animation:flip var(--idle-m) var(--e-out) infinite}
.i-coin .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.i-coin .face.b{transform:rotateY(180deg)}
.i-coin + .shadow{animation:coin-sh var(--idle-m) var(--e-out) infinite}
@keyframes flip{0%,8%{transform:rotateY(0)}40%{transform:rotateY(540deg)}100%{transform:rotateY(540deg)}}

            <div class="rule"><b>擋住整層</b><p>引導期間底下的畫面點不到。要玩家做的事放在卡片的選項上，由腳本代按——示範卦是假的，按到真的「入觀解卦」就會扣靈石、打 AI。</p></div>
            <div class="rule"><b>卡片不蓋聚光框</b><p>下面放得下放下面，否則上面；上下都不夠（桌機上整張盤）擺到框旁邊，寬度跟著空間縮。</p></div>

  <section id="talk">
    <div class="sec-h">
      <div class="tag">B 容器 · 對話</div>
      <h2>對話彈窗</h2>
      <p>一位角色當面跟玩家說一段話：頭像、名字與身分、這一段的標題、一塊台詞框，底下是玩家的罐頭回應。台詞分幾段就按幾次，像在回話，不是按確定。用在初次的問事規則（頁尾「問事規則」可重看），以及應期最近一直「沒準」的提醒（最近 5 次回評裡沒準到 3，部分準算半次；由最常替他起卦的那位說，30 天內不重複）。</p>
    </div>
    <div class="body">
      <div class="stage">
        <div class="demo"><button class="m-press btn primary" type="button" id="openTalk">開對話彈窗</button><small>應期沒準提醒（師妹）</small></div>
        <div class="demo"><button class="m-press btn" type="button" id="openTalkRule">問事規則</button><small>初次問事規則（師兄，可略過）</small></div>
      </div>
      <div class="stage">
        <div class="demo" style="align-items:stretch;width:min(320px,100%)"><div class="rev-demo" id="revDemo"><b>應期到了，準嗎？</b><div class="rev-row"><span>✓ 準</span><span>◐ 部分準</span><span class="on">✕ 沒準</span></div><button class="m-press btn primary" type="button" id="revSend">送出回評</button></div><small>智慧過渡：回評這一塊直接長成角色的對話彈窗（最近 5 次裡沒準到 3 時）</small></div>
      </div>
      <div class="rules">
        <div class="rule"><b>誰在說</b><p>頭像（吃換裝）＋名字＋身分，右上是段數「1 / 3」。只有一段就不顯示段數。</p></div>
        <div class="rule"><b>台詞框</b><p>台詞用角色口吻、帶「」；框有最小高度，換段時整張卡不跳動。標題硃砂小字，一段一個重點。</p></div>
        <div class="rule"><b>回應是玩家的話</b><p>寫成玩家會說的一句（「那我該怎麼做」），不寫「下一步」「確定」。第一顆硃砂實心，其餘淡；最後一段才放第二個選擇（例：「帶我去起卦」）。</p></div>
        <div class="rule"><b>關不關得掉</b><p>非選不可的對話：沒有 ✕，點外面不關。能略過的（初次規則）用一行小字「略過，我自己摸索」，最後一段收起。</p></div>
        <div class="rule"><b>動態</b><p>入場與離場同彈框（翻起／後倒）；換段時標題、台詞、回應逐行浮上（--stagger）。</p></div>
        <div class="rule"><b>從剛按的那一塊長出來</b><p>回應玩家剛做的事（送出回評）時用智慧過渡：卡片從那一塊的位置與大小補間到正中央（--t-page、--e-out、不過衝），字等卡片長好才浮上。那一塊不在畫面上、或減少動態，就照一般彈框入場。前端 <code>talkOpen({ …, from })</code> → <code>Motion.morph</code>。</p></div>
        <div class="rule"><b>前端</b><p>全站一份：<code>#guideModal</code>（<code>.guide-card</code>），內容由 <code>talkOpen({ cid, name, role, steps, skip, onDone })</code> 填（<code>src/main/33-guide.js</code>）。新的對話用它，不另做一張卡。</p></div>
      </div>
    </div>
  </section>

        ? `<button class="jw-sc" type="button" data-go="s:${x}"><div class="im" style="${bg(sc.img)}"></div><b>${sc.name}</b></button>`
        : `<div class="jw-sc lock"><div class="im">？</div><b>？？？</b></div>`; }).join("")}</div>
      <div class="jw-sec">可遇見的人<b>${c.pp}／${p.ppl.length}</b></div>
      <div class="jw-ppl">${p.ppl.map((x) => { const n = N[x], other = n.seen && !n.at.some((a) => S[a].place === k && S[a].seen);
        const where = other ? P[S[n.at.find((a) => S[a].seen)].place].name : "";
        return `<button class="jw-pp${n.seen ? "" : " lock"}" type="button" ${n.seen ? `data-go="n:${x}"` : "disabled"}><div class="im"><i style="${bg(n.img)}"></i></div><b>${n.seen ? n.name : "？？？"}</b>${where ? `<small>在${where}見過</small>` : ""}</button>`; }).join("")}</div>`;
  }
  function person(k) {
    const n = N[k];
    return `<div class="jw-top"><button class="jw-back" type="button" data-back>‹ ${pages.length > 1 ? pages[pages.length - 1].title : "見聞"}</button></div>
      <div class="jw-hero"><i style="${bg(n.img)}"></i></div>
      <div class="jw-name"><b>${n.name}</b><span>${n.role}</span></div>
      <p class="jw-desc">${n.desc}</p>
      <div class="jw-done">見過 ${n.got}／${n.of} 卦<div class="jw-bar"><i style="width:${Math.round(100 * n.got / n.of)}%"></i></div></div>
      <div class="jw-sec">出沒場景</div>
      <div class="jw-chips">${n.at.map((a) => S[a].seen ? `<button class="jw-chip" type="button" data-go="s:${a}"><small>${P[S[a].place].name}</small>${S[a].name}</button>`
        : `<span class="jw-chip lock"><small>${P[S[a].place].name}</small>？？？</span>`).join("")}</div>
      <div class="jw-sec">見過的下場<b>${n.fate.length}／${n.fateOf}</b></div>
      <div class="jw-list">${n.fate.map((f) => `<div>${f}<small>乾為天「龍不歸淵」</small></div>`).join("")}${Array.from({ length: n.fateOf - n.fate.length }, () => `<div class="lock">？？？</div>`).join("")}</div>
      <div class="jw-sec">出場事件</div>
      <div class="jw-list">${n.ev.map(([t, ok]) => `<div class="${ok ? "" : "lock"}">${t}</div>`).join("")}</div>`;
  }
  function scene(k) {
    const sc = S[k], p = P[sc.place];
    return `<div class="jw-top"><button class="jw-back" type="button" data-back>‹ ${pages[pages.length - 1].title}</button></div>
      <div class="jw-hero scene" style="${bg(sc.img)}"></div>
      <div class="jw-name"><b>${sc.name}</b><button class="jw-chip" type="button" data-go="p:${sc.place}"><small>地點</small>${p.name}</button></div>
      <p class="jw-desc">${sc.desc}</p>
      <div class="jw-sec">在這裡遇過的人</div>
      <div class="jw-ppl">${sc.ppl.map((x) => `<button class="jw-pp" type="button" data-go="n:${x}"><div class="im"><i style="${bg(N[x].img)}"></i></div><b>${N[x].name}</b></button>`).join("")}</div>
      <div class="jw-sec">出場事件</div>
      <div class="jw-list">${sc.ev.map((t) => `<div>${t}</div>`).join("")}</div>`;
  }
  const titleOf = (g) => { const [t, k] = g.split(":"); return t === "p" ? P[k].name : t === "n" ? N[k].name : t === "s" ? S[k].name : "見聞"; };
  function push(g, first) {
    const [t, k] = g.split(":");
    const html = t === "p" ? place(k) : t === "n" ? person(k) : t === "s" ? scene(k) : home();
    const el = document.createElement("div"); el.className = "jw-pg" + (first ? "" : " in"); el.innerHTML = html;
    const prev = pages[pages.length - 1];
    pages.push({ el, title: titleOf(g) }); stack.appendChild(el);
    if (!first) requestAnimationFrame(() => requestAnimationFrame(() => { el.classList.remove("in"); if (prev) prev.el.classList.add("under"); }));
  }
  function pop() {
    if (pages.length < 2) return;
    const cur = pages.pop(), prev = pages[pages.length - 1];
    cur.el.classList.add("in"); prev.el.classList.remove("under");
    setTimeout(() => cur.el.remove(), 480);
  }
  stack.addEventListener("click", (e) => {
    const b = e.target.closest("[data-back]"); if (b) { pop(); return; }
    const g = e.target.closest("[data-go]"); if (g) push(g.dataset.go);
  });
  push("home", true);
})();
</script>

      <h2>「沒有畫面靜止」的邊界</h2>

    <div class="body">
      <div class="rules">
        <div class="rule"><b>分三層</b><p>L0 環境（背景、裝飾，週期 ≥ 6 秒）、L1 待機（icon，2–4 秒）、L2 偶發（平常靜止，隨機觸發一次）。載入型只在等待時出現。</p></div>
        <div class="rule"><b>一個畫面只有一個主角</b><p>同一畫面最多一個 L1 以明顯幅度在動，其餘 L1 降到一半幅度，或改成 L2。</p></div>
        <div class="rule"><b>正在讀的文字不動</b><p>卦辭、解讀、談心對話的正文區，只允許背景 L0。這一條優先於「不能靜止」。</p></div>
        <div class="rule"><b>相位錯開</b><p>同型 icon 各自隨機起點。週期取不能整除的數字（2.4／3.7／6.1 秒），避免一起動而顯得機械。</p></div>
        <div class="rule"><b>該停就停</b><p>元件離開畫面、被彈框蓋住、App 進背景、省電模式時暫停。彈框開啟時只有彈框本身的待機在動。</p></div>
        <div class="rule"><b>減少動態</b><p>系統開啟「減少動態」時，待機全停，按壓改成只變暗，轉場改成 120ms 淡入淡出。</p></div>
        <div class="rule"><b>硃砂的動態也保留給行動</b><p>E 強調型只給「這裡有一件事要你處理」的元素用，和硃砂色的規則相同。</p></div>
        <div class="rule"><b>只動 transform 與 opacity</b><p>不動寬高、邊距、模糊半徑，避免掉幀與耗電。</p></div>
        <div class="rule"><b>凸起面上的字跟著面走</b><p>有厚度的元件，字要對齊「面」而不是整個元件。厚度畫在元件裡面時（例如開關的滑塊，底下那道硬陰影佔掉高度），面上的字上移，距離＝厚度。</p></div>
        <div class="rule"><b>置中扣掉字距</b><p>letter-spacing 會在最後一個字後面多留一格，字看起來偏左。用同寬的 text-indent 補回去；量字寬來擺滑塊時，也要扣掉那一格。</p></div>
        <div class="rule"><b>選中標記用滑的</b><p>頁籤、開關的選中狀態不跳色：底線、底塊、滑塊從舊位置滑到新位置，途中拉長蓋住兩格（底線、底塊）或擠扁（開關滑塊），到位時收回。有滑動標記的格子本身不做按壓縮放：按下的回饋交給標記，格子一縮會自成一層，把自己的底色疊到標記上面。</p></div>
        <div class="rule"><b>篩選也是頁籤</b><p>（示範見上方「TAG 頁籤」一節）一排選一個的篩選（全部／問卦／心得、月份）跟頁籤同一套：未選＝淡底淡墨、選中＝墨底滑過去。不另做硃砂實心或細框膠囊。格數固定就等寬撐滿；格數不定就貼字、放不下換行，底塊照樣滑。實作見前端 CLAUDE.md「頁籤」。</p></div>

    smart:'點到的卡片直接展開成整頁：剪裁框從卡片的位置和圓角長到全螢幕。'
  };
  let mode='push',busy=false,from=null;
  const chips=$('chips');

  $('tDesc').textContent=DESC[mode];
  const EO='cubic-bezier(.22,1,.36,1)';
  function run(el,kf,dur,opt={}){return el.animate(kf,{duration:dur,easing:EO,fill:'both',...opt}).finished}
  function frames(m,card){
    const W='100%';
    switch(m){
      case 'push':return{a:[{transform:'translateX(0)'},{transform:'translateX(-100%)'}],b:[{transform:'translateX(100%)'},{transform:'translateX(0)'}]};
      case 'slide':return{a:[{transform:'translateX(0)'},{transform:'translateX(-30%)'}],b:[{transform:'translateX(100%)',boxShadow:'-10px 0 30px rgba(24,18,12,0)'},{transform:'translateX(0)',boxShadow:'-10px 0 30px rgba(24,18,12,.25)'}],dim:[{opacity:0},{opacity:.25}]};
      case 'move':return{a:[{transform:'scale(1)',borderRadius:'0'},{transform:'scale(.94)',borderRadius:'16px'}],b:[{transform:'translateY(100%)'},{transform:'translateY(0)'}],dim:[{opacity:0},{opacity:.35}]};

  async function go(card){

    await Promise.all(jobs);busy=false;
  }

  /* ── D：公轉 keyframes（橢圓＋深度） ── */
  (function(){
    let s='@keyframes orbit{';
    for(let i=0;i<=24;i++){
      const t=i/24*Math.PI*2,x=Math.cos(t)*26,y=Math.sin(t)*7,z=Math.sin(t);

  /* ── D：相位錯開（同型 icon 起點隨機） ── */

  /* ── D：點選回應 ── */

  icons.addEventListener('click',e=>{const c=e.target.closest('.ic');if(!c)return;c.classList.remove('poke');void c.offsetWidth;c.classList.add('poke');if(c.dataset.occ)fire(c)});

  /* ── D：偶發排程（只在可見、未暫停時） ── */
  function fire(c){

  });

  (function(){

        if(root.classList.contains('rm'))return;

          {duration:340*K(),easing:'cubic-bezier(.22,1,.36,1)'});
      });
    });
  })();
})();
</script>

    cv.fillStyle = "#000"; cv.fillStyle = c; const s = cv.fillStyle;
    if (s[0] === "#") return { r: parseInt(s.slice(1,3),16), g: parseInt(s.slice(3,5),16), b: parseInt(s.slice(5,7),16), a: 1 };

    const btn = p.filter((c) => c.kind === "btn");
    if (link || btn.length) {
      s += `2. tokens.json 的 buttons：linked＝${cur.buttons.linked ? "true（照規範算式從色碼推）" : "false（各主題單獨設定，寫進 custom[主題][元件][零件]）"}。\n`;
      btn.forEach((c) => { s += `   ${c.tn}・${c.name}：${norm(c.to)}\n`; });
    }
    const bd = p.filter((c) => c.kind === "bd");
    if (bd.length) {
      s += `2b. tokens.json 的 backdrop（墊圖）改成：\n`;
      BD_SETS.forEach(([set, sn]) => { if (bd.some((c) => c.set === set)) s += `   ${set}（${sn}）：` + JSON.stringify(cur.backdrop[set]) + `\n`; });
      s += `   前端目前兩組都吃 styles/hall.css 的 .hall-bg（寫死的數字）；第一次套用時要把它改成吃 token（觀堂用 scene、問事／搖卦／批文／信件的 #deskBg 用 text），生成器補一個落點。\n`;
    }
    const wg = p.filter((c) => c.wg);
    if (wg.length) {
      s += `2c. tokens.json 的 widget.bg（小工具背板）改成：\n`;
      WG_SETS.forEach(([set, sn]) => { if (wg.some((c) => c.set === set)) s += `   ${set}（${sn}）：` + JSON.stringify(cur.widget[set]) + `\n`; });
      s += `   生成器會寫進前端 android/.../widget/Scenes.java 的 BG（生成區）；要出 APK 小工具才看得到。\n`;
    }
    s += `3. 跑 node dev/design/tokens/build.mjs --web <前端 repo>：前端主題色碼、按鈕、兩段開關、動態 token、小工具 Palette.java、規範頁、動態原型一起改。\n`;
    s += `   再把 dev/design/style/state.json 的 themes／buttons 設成跟 tokens.json 一樣（沒有待套用），跑 node dev/design/style/build.mjs，重新發佈規範。\n`;
    s += `4. 前端 npm run build（生成區被手改過會直接失敗），淺色與夜觀各截一張，與規範並排比對後再推送。`;
    return s;
  }

  /* ══ 互動 ══ */
  function setTok(k, v) {
    cur.themes[theme][k] = v;
    document.body.style.setProperty("--" + k, v);
    const row = document.querySelector(`.tok[data-k="${CSS.escape(k)}"]`);
    if (row) row.querySelector(".tok-sw span").style.background = v;
    const th = document.querySelector(`.th[data-th="${theme}"] i`);
    if (th && (k === "paper" || k === "cinnabar")) th.style.cssText = `background:${cur.themes[theme].paper};box-shadow:inset -7px 0 0 ${cur.themes[theme].cinnabar}`;
    if (cur.buttons.linked) document.querySelectorAll(".btn-types .anat").forEach(() => {});
    pushMotion(); refreshDirty(); scheduleBtnInfo();
  }
  let btnT = 0;
  function scheduleBtnInfo() {   // 連動時，按鈕卡上的色值跟著重算（輸入停手後再畫，不搶焦點）
    clearTimeout(btnT);
    btnT = setTimeout(() => { const box = document.querySelectorAll(".btn-types")[0]; if (box) box.innerHTML = BTN.map(btnCard).join(""); }, 250);
  }

  function bind() {
    const root = $("#root");
    root.querySelectorAll("[data-th]").forEach((b) => b.addEventListener("click", () => {
      theme = b.dataset.th; try { localStorage.setItem("spec-theme", theme); } catch (e) {}
      const y = scrollY; render(); scrollTo(0, y);
    }));
    root.addEventListener("input", (e) => {
      const t = e.target, id = t.id || "";
      if (t.dataset.wg) { wgSet1(wgSet, t.dataset.wg, Number(t.value)); return; }   // 小工具的滑桿
      if (t.dataset.bd) {   // 墊圖的滑桿
        const k = t.dataset.bd, v = Number(t.value), u = BD_KEYS.find((x) => x[0] === k)[2];
        cur.backdrop[bdSet][k] = v;
        t.nextElementSibling.textContent = v + u;
        t.closest(".bd-row").classList.toggle("changed", v !== STATE.bdBase[bdSet][k]);
        bdPaint(); refreshDirty();
        return;
      }
      if (id.startsWith("c-")) {
        const k = id.slice(2), a = parse(cur.themes[theme][k]).a, o = parse(t.value); o.a = a;
        const v = fmt(o); setTok(k, v); const tx = $("#t-" + CSS.escape(k)); if (tx) tx.value = v;
      } else if (id.startsWith("a-")) {
        const k = id.slice(2), o = parse(cur.themes[theme][k]); o.a = t.value / 100;
        const v = fmt(o); setTok(k, v); t.nextElementSibling.textContent = t.value + "%"; const tx = $("#t-" + CSS.escape(k)); if (tx) tx.value = v;
      } else if (t.dataset.bk) {
        const tb = (cur.buttons.custom[theme] = cur.buttons.custom[theme] || {}), bb = (tb[t.dataset.bk] = tb[t.dataset.bk] || {});
        bb[t.dataset.bp] = t.value.toUpperCase();
        document.body.style.setProperty(`--b-${t.dataset.bk}-${t.dataset.bp}`, bb[t.dataset.bp]);
        t.previousElementSibling.querySelector(".mono").textContent = bb[t.dataset.bp];
        t.previousElementSibling.previousElementSibling.style.background = bb[t.dataset.bp];
        pushMotion(); refreshDirty();
      }
    });
    root.addEventListener("change", (e) => {
      const t = e.target, id = t.id || "";
      if (id.startsWith("t-")) {
        const k = id.slice(2);
        try { const v = fmt(parse(t.value.trim())); setTok(k, v); t.value = v; $("#c-" + CSS.escape(k)).value = toHex(parse(v)); }
        catch (err) { toast("看不懂這個色碼：" + t.value); t.value = cur.themes[theme][k]; }
      } else if (id === "linked") {
        cur.buttons.linked = t.checked;
        if (!t.checked) {   // 斷開那一刻：把目前算出來的色抄成各自的起點，畫面不會跳
          THEMES.forEach(([th]) => { cur.buttons.custom[th] = cur.buttons.custom[th] || {}; });
          BTN.forEach((b) => { const c = (cur.buttons.custom[theme][b.k] = cur.buttons.custom[theme][b.k] || {});
            partsOf(b).forEach(([p]) => { if (!c[p]) c[p] = resolve(linkExpr(b, p, theme)); }); });
        }
        const y = scrollY; render(); scrollTo(0, y);
      }
    });
    root.addEventListener("click", (e) => {
      const ws = e.target.closest("[data-wgset]");
      if (ws) { wgPick(ws.dataset.wgset); return; }
      const bs = e.target.closest("[data-bdset]");
      if (bs) {
        bdSet = bs.dataset.bdset;
        root.querySelectorAll("[data-bdset]").forEach((b) => b.setAttribute("aria-pressed", String(b === bs)));
        $("#bdRows").innerHTML = bdRows();
        return;
      }
      const r = e.target.closest("[data-reset]");
      if (r) { const k = r.dataset.reset, v = STATE.baseline[theme][k]; setTok(k, v); const y = scrollY; render(); scrollTo(0, y); return; }
      if (e.target.id === "saveBtn") return askSave();
      if (e.target.id === "revert") return askRevert();
      if (e.target.id === "copyBrief") return copy($("#brief").textContent);
    });
    // 兩段開關示範：點了換邊
    root.addEventListener("click", (e) => {
      const b = e.target.closest("[data-seg-demo] button"); if (!b) return;
      b.parentElement.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b));
    });
    // 按鈕按下：鍵盤也要沉得下去
    root.addEventListener("keydown", (e) => { if ((e.key === " " || e.key === "Enter") && e.target.classList.contains("b")) e.target.classList.add("down"); });
    root.addEventListener("keyup", (e) => { if (e.target.classList && e.target.classList.contains("b")) e.target.classList.remove("down"); });
  }

  function dlg(html, onOk, okText) {
    const d = $("#dlg"), c = d.firstElementChild;
    c.innerHTML = html + `<div class="dlg-row"><button class="ghost" data-x>取消</button><button class="solid" data-ok>${esc(okText || "確定")}</button></div>`;
    d.hidden = false;
    const close = () => { d.hidden = true; };
    c.querySelector("[data-x]").onclick = close;
    c.querySelector("[data-ok]").onclick = async () => { close(); await onOk(); };
    d.onclick = (e) => { if (e.target === d) close(); };
    c.querySelector("[data-ok]").focus();
  }
  function askSave() {
    const u = unsaved();
    dlg(`<h3 id="dlgT">存檔這 ${u.length} 項修改？</h3>
      <p class="note">存檔會把修改寫進這份規範（所有打開這份規範的人都會看到新版）。站上不會馬上變——存檔後在「待套用」拿一段說明，開新會議套用並推送。</p>
      <div class="pending">${u.map(chgHtml).join("")}</div>`, save, "存檔");
  }
  function askRevert() {
    dlg(`<h3 id="dlgT">還原到上次存檔？</h3><p class="note">這次的 ${unsaved().length} 項修改會丟掉，回到上次存檔的樣子。</p>`,
      () => { cur = clone(saved); const y = scrollY; render(); scrollTo(0, y); toast("已還原到上次存檔"); }, "還原");
  }

  /* 存檔：整份頁面連同新狀態重新發佈（artifact 能力）。頁面的靜態部分在載入時就讀好，
     不去序列化畫面上的 DOM；只換掉狀態那一包。 */
  const SRC = {
    title: document.querySelector("title") ? document.querySelector("title").outerHTML : "<title>幾知觀 美術規範</title>",
    fonts: (document.querySelector('link[href*="fonts.googleapis"]') || {}).outerHTML || "",
    style: document.getElementById("spec-style").outerHTML,
    motion: document.getElementById("motionSrc").innerHTML,
    app: document.getElementById("spec-app").textContent,
  };
  const SKEL = '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>';
  async function save() {
    let art = null;
    try { art = window.claude && window.claude.use ? await window.claude.use("artifact") : null; } catch (e) { art = null; }
    if (!art) { toast("這個檢視不能存檔（沒有編輯權限，或不在 claude.ai 裡開）"); return; }
    const next = { ...STATE, themes: cur.themes, buttons: cur.buttons, backdrop: cur.backdrop, widget: cur.widget, savedAt: new Date().toISOString(),
      history: [...(STATE.history || []), { at: new Date().toISOString(), changes: unsaved().map((c) => ({ ...c })) }] };
    const json = JSON.stringify(next).replace(/</g, "\\u003c");
    const html = SKEL + SRC.title + "\n" + SRC.fonts + "\n" + SRC.style + '\n<div id="root"></div>\n<template id="motionSrc">' + SRC.motion +
      '</template>\n<script id="spec-state" type="application/json">' + json + "</scr" + "ipt>\n<script id=\"spec-app\">" + SRC.app + "</scr" + "ipt>\n</body></html>";
    try { await art.publish(html); toast("已存檔，頁面會重新載入成新版"); }
    catch (e) {
      const code = (e && (e.code || e.message)) || "";
      toast(/conflict/.test(code) ? "有人剛存了新版，頁面會換成那一版，請再改一次" : /not_(granted|writer)/.test(code) ? "你對這份規範只有讀取權限，不能存檔" : "沒存成：" + code);
    }
  }

  let tT = 0;
  function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(tT); tT = setTimeout(() => { t.hidden = true; }, 2600); }
  function copy(txt) {
    try { navigator.clipboard.writeText(txt).then(() => toast("已複製"), () => sel()); } catch (e) { sel(); }
    function sel() { const r = document.createRange(); r.selectNodeContents($("#brief")); const s = getSelection(); s.removeAllRanges(); s.addRange(r); toast("已選取，按 Ctrl+C 複製"); }
  }

  /* 通用 TAG 頁籤：墨底滑過去（同前端 ui/motion.js 的 pill） */
  function tabsInit() {
    const frame = (p) => ({ width: p.w + "px", height: p.h + "px", transform: `translate(${p.x}px,${p.y}px)` });
    const pos = (t) => ({ x: t.offsetLeft, y: t.offsetTop, w: t.offsetWidth, h: t.offsetHeight });
    document.querySelectorAll(".tag-tabs[data-demo]").forEach((g) => {
      const mk = document.createElement("i"); mk.className = "m-pill"; g.prepend(mk);
      const place = () => { const on = g.querySelector(".tag-tab.on"); if (on) Object.assign(mk.style, frame(pos(on))); };
      place(); if (document.fonts && document.fonts.ready) document.fonts.ready.then(place);
      g.addEventListener("click", (e) => {
        const to = e.target.closest(".tag-tab"), from = g.querySelector(".tag-tab.on"); if (!to || to === from) return;
        const a = pos(from), b = pos(to); from.classList.remove("on"); to.classList.add("on"); Object.assign(mk.style, frame(b));
        if (matchMedia("(prefers-reduced-motion:reduce)").matches) return;
        const L = Math.min(a.x, b.x), R = Math.max(a.x + a.w, b.x + b.w);
        mk.animate([frame(a), { ...frame({ x: L, y: b.y, w: R - L, h: b.h }), offset: .45 }, frame(b)], { duration: 340, easing: "cubic-bezier(.22,1,.36,1)" });
      });
    });
  }

  /* 動態規範：同一份原型嵌在 iframe 裡，色碼由這裡灌進去。
     它自己的色名與站上不完全同義（它的 --paper-2 是亮紙），所以要對照著換：
       --ground ← 紙　--paper ← 紙　--paper-2 ← 文字按鈕的面　--paper-edge ← 紙邊 … */
  function motionInit() {
    const f = $("#motionFrame"); if (!f) return;
    f.addEventListener("load", pushMotion);
    // 原型是照 artifact 的寫法寫的（沒有 doctype）：包一層完整文件，不然 iframe 會進怪異模式
    f.srcdoc = SRC.motion.trim()
      ? '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"></head><body>' + SRC.motion + "</body></html>"
      : "<p style='font:14px sans-serif;padding:20px'>（這一版沒有嵌入動態規範）</p>";
  }
  function pushMotion() {
    const f = $("#motionFrame"); let d; try { d = f && f.contentDocument; } catch (e) { d = null; }
    if (!d || !d.documentElement) return;
    const T = cur.themes[theme], st = d.documentElement.style, bs = getComputedStyle(document.body);
    const face = resolve(bs.getPropertyValue("--b-text-face").trim() || lightFace(theme));
    const map = { ground: T.paper, paper: T.paper, "paper-2": face, "paper-edge": T["paper-edge"], ink: T.ink, "ink-soft": T["ink-soft"], "ink-faint": T["ink-faint"],
      cinnabar: resolve(bs.getPropertyValue("--b-primary-face").trim() || T.cinnabar), "cinnabar-edge": resolve(bs.getPropertyValue("--b-primary-edge").trim()),
      gold: resolve(bs.getPropertyValue("--b-second-face").trim() || T.gold), "gold-edge": resolve(bs.getPropertyValue("--b-second-edge").trim()),
      hair: T.hair, shade: T.shadow,
      // 站上的次一階紙與五行木（搜尋框、保存標籤）：原型的 --paper-2 是亮紙，站上這一塊另接
      "app-paper-2": T["paper-2"], "wx-木": T["wx-木"] };
    Object.entries(map).forEach(([k, v]) => { if (v) st.setProperty("--" + k, v); });
    st.colorScheme = DARK[theme] ? "dark" : "light";
    if (d.body) d.body.style.background = T.paper;
  }

  render();
})();
</script>
