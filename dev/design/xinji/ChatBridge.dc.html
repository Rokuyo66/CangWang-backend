<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@400;500&display=swap">
  <style>
    /* ⚠ 這一張是**墨底**，與心跡那四張的宣紙暖白不同。
       不是忘了統一——這張卡出現在閒聊畫面上（part1.html 那組變數），
       而閒聊是墨底的。畫成宣紙色只會讓人以為心跡已經換皮了。
       兩套要不要合，見 README 那個還沒下的決定。 */
    body{margin:0;font-family:"Noto Serif TC","Songti TC",serif;line-height:1.75;color:#e8e0d4;
      -webkit-font-smoothing:antialiased}
    *{box-sizing:border-box}
    button{font-family:inherit;color:inherit;cursor:pointer}
    .sans{font-family:"Noto Sans TC",system-ui,sans-serif}
    .bub{background:#1a1714;border:1px solid #332c25;border-radius:14px;padding:11px 14px;
      font-size:14.5px;line-height:1.8;max-width:82%}
    .me{background:#221d17;border-color:#3d3428;margin-left:auto}
    .dim{color:#8b8073}
    .pen{width:15px;height:15px;flex-shrink:0;opacity:.75}
  </style>
</helmet>

<div style="width:390px;height:844px;background:#12100e;display:flex;flex-direction:column;overflow:hidden;position:relative">

  <div style="height:47px;flex-shrink:0"></div>

  <!-- 頂列 -->
  <div style="display:flex;align-items:center;gap:10px;padding:2px 18px 12px;flex-shrink:0">
    <div style="width:34px;height:34px;border-radius:50%;background:#3a3125;display:flex;align-items:center;justify-content:center;font-size:14px;color:#c8a86b">兄</div>
    <div style="flex:1;min-width:0">
      <div style="font-size:15px;letter-spacing:.08em">大師兄</div>
      <div class="sans dim" style="font-size:10.5px">今日還能說 6 句</div>
    </div>
  </div>

  <!-- 對話 -->
  <div style="flex:1;overflow-y:auto;padding:4px 18px 16px;display:flex;flex-direction:column;gap:10px">

    <div class="bub me sans">那筆尾款拖兩個月了，對方一直說再等等</div>

    <!-- 角色的每一則都能單獨念／收（長按或右側小鈕，不常駐——
         一長串對話框每格掛兩顆鈕，畫面會吵成一片按鈕海） -->
    <div style="display:flex;align-items:flex-end;gap:8px">
      <div class="bub">催不動的錢，多半不是不想給。<br>你怕的是撕破臉，還是怕它真的收不回來？</div>
      <div style="display:flex;flex-direction:column;gap:6px;padding-bottom:2px">
        <button aria-label="念給我聽" style="width:28px;height:28px;border-radius:50%;background:#1a1714;border:1px solid #332c25;display:flex;align-items:center;justify-content:center;padding:0">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="#c8a86b" aria-hidden="true"><path d="M8 5.5v13l11-6.5Z"></path></svg>
        </button>
        <button aria-label="收下這句" style="width:28px;height:28px;border-radius:50%;background:#1a1714;border:1px solid #332c25;display:flex;align-items:center;justify-content:center;padding:0">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8b8073" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4-6 4V5a1 1 0 0 1 1-1Z"></path></svg>
        </button>
      </div>
    </div>

    <div class="bub me sans">怕收不回來。已經第三次說下個月了</div>

    <!-- ═══ 擬題確認卡：閒聊唯一通往起卦的門，也是心跡唯一不必重打一遍的入口 ═══ -->
    <div style="border:1px solid #4a3d2a;background:#181510;border-radius:14px;padding:14px;margin-top:2px">

      <div class="sans" style="font-size:10.5px;letter-spacing:.18em;color:#c8a86b;margin-bottom:9px">那就別再等他開口——這事我替你理成一句</div>

      <!-- 問句：可改。改不動的話，擬得再好也只是替他決定 -->
      <div style="display:flex;align-items:flex-start;gap:10px;background:#12100e;border:1px solid #332c25;border-radius:10px;padding:11px 12px">
        <div style="flex:1;font-size:15px;line-height:1.8">三個月內，那筆尾款收得回來嗎？</div>
        <svg class="pen" viewBox="0 0 24 24" fill="none" stroke="#c8a86b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2 2 0 0 0-3-3L5 17Z"></path></svg>
      </div>

      <!-- 先記下這件事。title 與那句總結都是伺服器擬題時順手給的，兩個都要改得動 -->
      <div style="margin-top:12px;padding-top:12px;border-top:1px dashed #332c25">
        <label style="display:flex;align-items:center;gap:9px;cursor:pointer">
          <span style="width:17px;height:17px;flex-shrink:0;border-radius:4px;background:#c8a86b;display:flex;align-items:center;justify-content:center">
            <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#12100e" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5 10 17.5 19 7"></path></svg>
          </span>
          <span class="sans" style="font-size:13px">先把這件事記進心跡</span>
        </label>

        <div style="display:flex;align-items:center;gap:8px;margin:9px 0 0 26px">
          <div style="display:flex;align-items:center;gap:7px;background:#12100e;border:1px solid #3d3428;border-radius:999px;padding:5px 12px">
            <span style="font-size:13.5px">那筆尾款</span>
            <svg class="pen" viewBox="0 0 24 24" fill="none" stroke="#8b8073" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9a2 2 0 0 0-3-3L5 17Z"></path></svg>
          </div>
          <span class="sans dim" style="font-size:10.5px">在記 0／1 件</span>
        </div>

        <p class="sans dim" style="margin:8px 0 0 26px;font-size:12px;line-height:1.75">尾款拖了兩個月，對方一直說再等等，他不敢催怕撕破臉。</p>
      </div>

      <div style="display:flex;gap:9px;margin-top:14px">
        <button class="sans" style="flex:1;background:#c8a86b;border:none;border-radius:10px;padding:12px;font-size:14px;letter-spacing:.1em;color:#12100e;min-height:44px">記下，然後揭卦</button>
        <button class="sans" style="background:none;border:1px solid #332c25;border-radius:10px;padding:12px 14px;font-size:13px;color:#8b8073;min-height:44px">只揭卦</button>
      </div>
    </div>

    <div class="sans" style="margin-top:14px;font-size:10px;letter-spacing:.2em;color:#5e564b">— 同一張卡的另兩種狀態 —</div>

    <!-- ═══ 另一種：這件事已經在記了（question_norm 或事由對上） ═══ -->
    <div style="border:1px solid #332c25;background:#181510;border-radius:14px;padding:13px 14px;margin-top:4px">
      <div style="display:flex;align-items:center;gap:9px">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#c8a86b" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0" aria-hidden="true">
          <path d="M5 4h11l3 3v13H5z"></path><path d="M9 9h6"></path><path d="M9 13h6"></path>
        </svg>
        <div style="flex:1;min-width:0;font-size:13.5px">這件事你在記了——<span style="color:#c8a86b">那筆尾款</span></div>
        <span class="sans dim" style="font-size:10.5px;flex-shrink:0">問過 2 次</span>
      </div>
      <p class="sans dim" style="margin:7px 0 0;font-size:11.5px;line-height:1.7">這一卦會接到那條線上。同一件事再問一次不算重複問——一事不二占不會擋。</p>
    </div>

    <!-- ═══ 第三種：記不下新的了。只丟一句「滿了」是最沒用的擋法 ═══ -->
    <div style="border:1px dashed #3d3428;border-radius:12px;padding:12px 14px;margin-top:2px">
      <p class="sans" style="margin:0;font-size:12.5px;line-height:1.8;color:#8b8073">心跡同時只記得住一件事。要不要就記在<span style="color:#c8a86b">「那筆尾款」</span>底下？<br>或先了結手上那一件——也可以持玉牒入觀，多幾格。</p>
    </div>

  </div>

  <!-- 輸入列 -->
  <div style="flex-shrink:0;display:flex;align-items:center;gap:10px;padding:10px 16px 26px;border-top:1px solid #221d17;background:#12100e">
    <div class="sans dim" style="flex:1;background:#1a1714;border:1px solid #332c25;border-radius:999px;padding:11px 16px;font-size:13.5px">說點什麼…</div>
    <button aria-label="送出" style="width:42px;height:42px;flex-shrink:0;border-radius:50%;background:#c8a86b;border:none;display:flex;align-items:center;justify-content:center;padding:0">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#12100e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15"></path><path d="M13 6l6 6-6 6"></path></svg>
    </button>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
