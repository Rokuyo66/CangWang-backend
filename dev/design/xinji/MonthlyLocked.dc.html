<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600&display=swap">
  <style>
    body{margin:0;font-family:"Noto Serif TC","Songti TC",serif;line-height:1.75;
      -webkit-font-smoothing:antialiased}
    a{color:#c8a86b}a:hover{color:#e0c48a}
    *{box-sizing:border-box}
    button{font-family:inherit;color:inherit;cursor:pointer}
  </style>
</helmet>

<div style="width:390px;height:844px;background:#12100e;color:#e8e0d4;display:flex;flex-direction:column;overflow:hidden">

  <div style="height:47px;flex-shrink:0"></div>

  <div style="display:flex;align-items:baseline;justify-content:space-between;padding:0 22px 14px">
    <span style="font-size:23px;letter-spacing:.22em;font-weight:500">心跡</span>
  </div>

  <div style="display:flex;gap:26px;padding:0 22px;border-bottom:1px solid #262019;flex-shrink:0">
    <div style="padding-bottom:11px;font-size:14px;letter-spacing:.18em;color:#6e665b">心事</div>
    <div style="padding-bottom:11px;border-bottom:1px solid #c8a86b;font-size:14px;letter-spacing:.18em;color:#c8a86b">月誌</div>
  </div>

  <div style="flex:1;overflow-y:auto;padding:22px 22px 24px">
    <div style="display:flex;flex-direction:column;gap:18px">

      <!-- 這一月的實據：免費也看得到，因為那本來就是他的 -->
      <div style="display:flex;flex-direction:column;gap:13px">
        <div style="display:flex;align-items:baseline;gap:10px">
          <span style="font-size:19px;letter-spacing:.14em">三月</span>
          <span style="font-size:11px;letter-spacing:.14em;color:#5f574c">乙巳　尚未終月</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:#262019;border:1px solid #262019">
          <div style="background:#161310;padding:13px 10px;display:flex;flex-direction:column;gap:4px;align-items:center">
            <span style="font-size:23px;color:#c8a86b;font-variant-numeric:tabular-nums;line-height:1.2">12</span>
            <span style="font-size:11px;letter-spacing:.1em;color:#8b8073">卦</span>
          </div>
          <div style="background:#161310;padding:13px 10px;display:flex;flex-direction:column;gap:4px;align-items:center">
            <span style="font-size:23px;color:#c8a86b;font-variant-numeric:tabular-nums;line-height:1.2">3</span>
            <span style="font-size:11px;letter-spacing:.1em;color:#8b8073">記掛</span>
          </div>
          <div style="background:#161310;padding:13px 10px;display:flex;flex-direction:column;gap:4px;align-items:center">
            <span style="font-size:23px;color:#c8a86b;font-variant-numeric:tabular-nums;line-height:1.2">2/5</span>
            <span style="font-size:11px;letter-spacing:.1em;color:#8b8073">已回報</span>
          </div>
        </div>
      </div>

      <!-- 封緘的卷 -->
      <div style="position:relative;border:1px solid #332c25;background:#161310;padding:26px 22px 24px;display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center">

        <div style="width:52px;height:52px;border:1.5px solid #9c3b30;display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <span style="font-size:20px;color:#9c3b30;letter-spacing:0;line-height:1">封</span>
        </div>

        <div style="display:flex;flex-direction:column;gap:14px;font-size:14.5px;line-height:2.05;color:#cfc5b6">
          <div>三月的卷宗已經齊了。<br>只是觀中無人為你翻開。</div>
          <div style="color:#8b8073;font-size:13.5px;line-height:2">觀有司籍者，每月朔日為持牒之人<br>理其所問、擇其所應，錄成一卷，<br>題道號於卷首，附一句該說的話。</div>
        </div>

        <div style="width:40px;height:1px;background:#332c25"></div>

        <div style="display:flex;flex-direction:column;gap:11px;width:100%;align-items:center">
          <button style="width:100%;min-height:50px;background:#1f1a15;border:1px solid #c8a86b;color:#c8a86b;font-size:15.5px;letter-spacing:.2em">持玉牒入觀</button>
          <span style="font-size:11.5px;color:#5f574c;letter-spacing:.06em">牒既在手，此後每月初一，卷自至</span>
        </div>
      </div>

      <!-- 往月：也是封的 -->
      <div style="display:flex;flex-direction:column;gap:10px">
        <div style="font-size:11px;letter-spacing:.28em;color:#5f574c">往　月</div>
        <div style="display:flex;align-items:center;gap:12px;border:1px solid #241e18;background:#151310;padding:13px 15px">
          <span style="flex:1;font-size:14.5px;color:#8b8073">二月　9 卦　4 事</span>
          <span style="font-size:11.5px;color:#5f574c;letter-spacing:.1em">未啟封</span>
        </div>
        <div style="display:flex;align-items:center;gap:12px;border:1px solid #241e18;background:#151310;padding:13px 15px">
          <span style="flex:1;font-size:14.5px;color:#8b8073">正月　6 卦　2 事</span>
          <span style="font-size:11.5px;color:#5f574c;letter-spacing:.1em">未啟封</span>
        </div>
      </div>

    </div>
  </div>

  <div style="flex-shrink:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid #262019;background:#0f0d0b;padding-top:8px;padding-bottom:22px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;min-height:44px;color:#6e665b">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 10h7"></path><path d="M4 14h16"></path><path d="M4 18h7"></path></svg>
      <span style="font-size:10.5px;letter-spacing:.1em">排盤</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;min-height:44px;color:#6e665b">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15a3 3 0 0 1-3 3H8l-4 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3Z"></path></svg>
      <span style="font-size:10.5px;letter-spacing:.1em">廣場</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;min-height:44px;color:#c8a86b">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"></path><path d="M9 9h6"></path><path d="M9 13h6"></path><path d="M9 17h3"></path></svg>
      <span style="font-size:10.5px;letter-spacing:.1em">心跡</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;min-height:44px;color:#6e665b">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 4a8 8 0 0 0 0 16"></path></svg>
      <span style="font-size:10.5px;letter-spacing:.1em">道緣</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;min-height:44px;color:#6e665b">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20a7 7 0 0 1 14 0"></path></svg>
      <span style="font-size:10.5px;letter-spacing:.1em">我</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
