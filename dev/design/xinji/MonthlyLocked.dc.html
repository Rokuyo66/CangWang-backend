<!doctype html>
<html>
<head>
  <meta charset="utf-8">

<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@400;500&display=swap">
  <style>
    body{margin:0;font-family:"Noto Serif TC","Songti TC",serif;line-height:1.75;color:#3A322A;
      -webkit-font-smoothing:antialiased}
    a{color:#B08A4A}a:hover{color:#8d6c36}
    *{box-sizing:border-box}
    button{font-family:inherit;color:inherit;cursor:pointer}
    .sans{font-family:"Noto Sans TC",system-ui,sans-serif}
    .card{background:#FFFDF8;border:1px solid #E0D5BF;border-radius:14px;
      box-shadow:0 1px 0 rgba(58,50,42,.04),0 6px 16px -12px rgba(58,50,42,.35)}
    .ruled{background-image:repeating-linear-gradient(to bottom,
      transparent 0,transparent 27px,#EDE4D2 27px,#EDE4D2 28px)}
    .stk{position:absolute;filter:drop-shadow(0 3px 5px rgba(58,50,42,.18))}
  </style>
</helmet>

<div style="width:390px;height:844px;background:#F7F3EA;display:flex;flex-direction:column;overflow:hidden;position:relative">
  <div style="height:47px;flex-shrink:0"></div>
  <div style="padding:2px 22px 12px"><span style="font-size:24px;letter-spacing:.2em;font-weight:600">心跡</span></div>
  <div style="display:flex;gap:8px;padding:0 22px 14px;flex-shrink:0">
    <div style="padding:6px 16px;border-radius:999px;background:#EDE6D7;color:#8A7C68;font-size:13.5px;letter-spacing:.12em">心事</div>
    <div style="padding:6px 16px;border-radius:999px;background:#3A322A;color:#F7F3EA;font-size:13.5px;letter-spacing:.12em">月誌</div>
    <div style="padding:6px 16px;border-radius:999px;background:#EDE6D7;color:#8A7C68;font-size:13.5px;letter-spacing:.12em">語音</div>
  </div>

  <div style="flex:1;overflow-y:auto;padding:4px 18px 92px">
    <div style="display:flex;flex-direction:column;gap:18px">

      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;align-items:baseline;gap:10px;padding:0 4px">
          <span style="font-size:20px;letter-spacing:.12em;font-weight:600">三月</span>
          <span class="sans" style="font-size:11px;color:#B5A88F">乙巳・尚未終月</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px">
          <div class="card" style="padding:14px 8px;display:flex;flex-direction:column;gap:3px;align-items:center">
            <span class="sans" style="font-size:24px;color:#B08A4A;line-height:1.2;font-weight:500">12</span>
            <span class="sans" style="font-size:11px;color:#8A7C68">卦</span></div>
          <div class="card" style="padding:14px 8px;display:flex;flex-direction:column;gap:3px;align-items:center">
            <span class="sans" style="font-size:24px;color:#B08A4A;line-height:1.2;font-weight:500">3</span>
            <span class="sans" style="font-size:11px;color:#8A7C68">記掛</span></div>
          <div class="card" style="padding:14px 8px;display:flex;flex-direction:column;gap:3px;align-items:center">
            <span class="sans" style="font-size:24px;color:#B08A4A;line-height:1.2;font-weight:500">2/5</span>
            <span class="sans" style="font-size:11px;color:#8A7C68">已回報</span></div>
        </div>
      </div>

      <!-- 封緘的卷 -->
      <div style="position:relative">
        <div style="position:absolute;width:80px;height:22px;left:50%;margin-left:-40px;top:-8px;background:#D9C79C;border-radius:2px;transform:rotate(-1.5deg);opacity:.85;box-shadow:0 1px 2px rgba(58,50,42,.12)"></div>
        <div class="card" style="padding:28px 22px 24px;display:flex;flex-direction:column;gap:18px;align-items:center;text-align:center;background:#FDF9F0">
          <div style="width:54px;height:54px;border:1.5px solid #C0483A;border-radius:10px;display:flex;align-items:center;justify-content:center;transform:rotate(-6deg)">
            <span style="font-size:21px;color:#C0483A;line-height:1">封</span>
          </div>
          <div style="display:flex;flex-direction:column;gap:13px;font-size:15px;line-height:2">
            <div>三月的卷宗已經齊了。<br>只是觀中無人為你翻開。</div>
            <div style="color:#8A7C68;font-size:13.5px;line-height:1.95">觀有司籍者，每月朔日為持牒之人<br>理其所問、擇其所應，錄成一卷，<br>題道號於卷首，附一句該說的話。</div>
          </div>
          <div style="width:36px;height:1px;background:#E0D5BF"></div>
          <div style="display:flex;flex-direction:column;gap:10px;width:100%;align-items:center">
            <button style="width:100%;min-height:50px;background:#B08A4A;border:none;border-radius:999px;color:#FFFDF8;font-size:16px;letter-spacing:.18em">持玉牒入觀</button>
            <span class="sans" style="font-size:11.5px;color:#B5A88F">牒既在手，此後每月初一，卷自至</span>
          </div>
        </div>
        <svg class="stk" width="34" height="34" viewBox="0 0 36 36" style="right:-4px;bottom:-10px;transform:rotate(14deg)" aria-hidden="true">
          <path d="M18 5 21 14h9.5l-7.7 5.6 3 9.4L18 23.2 10.2 29l3-9.4L5.5 14H15Z" fill="#D9C79C"></path>
        </svg>
      </div>

      <div style="display:flex;flex-direction:column;gap:10px">
        <div class="sans" style="font-size:11px;letter-spacing:.24em;color:#B5A88F;padding:0 4px">往　月</div>
        <div class="card" style="padding:14px 16px;display:flex;align-items:center;gap:12px;background:#F4EFE3;box-shadow:none">
          <span style="flex:1;font-size:15px;color:#8A7C68">二月　9 卦　4 事</span>
          <span class="sans" style="font-size:11.5px;color:#B5A88F">未啟封</span>
        </div>
        <div class="card" style="padding:14px 16px;display:flex;align-items:center;gap:12px;background:#F4EFE3;box-shadow:none">
          <span style="flex:1;font-size:15px;color:#8A7C68">正月　6 卦　2 事</span>
          <span class="sans" style="font-size:11.5px;color:#B5A88F">未啟封</span>
        </div>
      </div>

    </div>
  </div>

  <button aria-label="貼紙口袋" style="position:absolute;right:16px;bottom:104px;width:56px;height:56px;border-radius:50%;background:#FFFDF8;border:1px solid #E0D5BF;box-shadow:0 6px 18px -8px rgba(58,50,42,.5);display:flex;align-items:center;justify-content:center;padding:0"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#B08A4A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5V14l-6 6H5.5A1.5 1.5 0 0 1 4 18.5Z"></path><path d="M20 14h-4.5a1.5 1.5 0 0 0-1.5 1.5V20"></path></svg></button>
  <div style="position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#FFFDF8;border-top:1px solid #E6DCC8;padding-top:9px;padding-bottom:22px">
    <div class="sans" style="display:flex;flex-direction:column;align-items:center;gap:4px;min-height:44px;color:#B5A88F"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 10h7"></path><path d="M4 14h16"></path><path d="M4 18h7"></path></svg><span style="font-size:10.5px">排盤</span></div>
    <div class="sans" style="display:flex;flex-direction:column;align-items:center;gap:4px;min-height:44px;color:#B5A88F"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15a3 3 0 0 1-3 3H8l-4 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3Z"></path></svg><span style="font-size:10.5px">廣場</span></div>
    <div class="sans" style="display:flex;flex-direction:column;align-items:center;gap:4px;min-height:44px;color:#B08A4A"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"></path><path d="M9 9h6"></path><path d="M9 13h6"></path><path d="M9 17h3"></path></svg><span style="font-size:10.5px;font-weight:500">心跡</span></div>
    <div class="sans" style="display:flex;flex-direction:column;align-items:center;gap:4px;min-height:44px;color:#B5A88F"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 4a8 8 0 0 0 0 16"></path></svg><span style="font-size:10.5px">道緣</span></div>
    <div class="sans" style="display:flex;flex-direction:column;align-items:center;gap:4px;min-height:44px;color:#B5A88F"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20a7 7 0 0 1 14 0"></path></svg><span style="font-size:10.5px">我</span></div>
  </div>
</div>
