<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@400;500&display=swap">
  <style>
    body{margin:0;font-family:"Noto Serif TC","Songti TC",serif;line-height:1.75;color:#3A322A;
      -webkit-font-smoothing:antialiased}
    a{color:#B08A4A}a:hover{color:#8d6c36}
    *{box-sizing:border-box}
    button{font-family:inherit;color:inherit;cursor:pointer}
    .sans{font-family:"Noto Sans TC",system-ui,sans-serif}
    .card{background:#FFFDF8;border:1px solid #E0D5BF;border-radius:14px;
      box-shadow:0 1px 0 rgba(58,50,42,.04),0 6px 16px -12px rgba(58,50,42,.35)}
    .ruled{background-image:repeating-linear-gradient(to bottom,
      transparent 0,transparent 27px,#EDE4D2 27px,#EDE4D2 28px)}
    .stk{position:absolute;filter:drop-shadow(0 3px 5px rgba(58,50,42,.18))}
  </style>
</helmet>

<div style="width:390px;height:844px;background:#F7F3EA;display:flex;flex-direction:column;overflow:hidden;position:relative">
  <div style="height:47px;flex-shrink:0"></div>
  <div style="display:flex;align-items:center;gap:9px;padding:0 22px 10px">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8A7C68" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"></path></svg>
    <span class="sans" style="font-size:12.5px;color:#8A7C68">月誌</span>
  </div>

  <div style="flex:1;overflow-y:auto;padding:0 18px 92px">
    <div style="display:flex;flex-direction:column;gap:20px">

      <!-- 卷首 -->
      <div style="position:relative">
        <div class="card ruled" style="padding:20px 18px;background:#FDF9F0;border-top:2px solid #C0483A">
          <div style="display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px">
            <span style="font-size:20px;letter-spacing:.14em;font-weight:600">二月卷</span>
            <span class="sans" style="font-size:11px;color:#B5A88F">錄與　守拙</span>
          </div>
          <div style="font-size:15px;line-height:2">
            這一月你問得急。二月初九那幾天，一天之內起了三卦，問的其實是同一件事——
            卦沒有變壞，是你等不及。<br><br>
            月末那兩卦，語氣鬆了。你大概是自己想通了什麼。
          </div>
        </div>
      </div>

      <!-- 所問 -->
      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;align-items:baseline;justify-content:space-between;padding:0 4px">
          <span class="sans" style="font-size:11px;letter-spacing:.24em;color:#B5A88F">所　問</span>
          <span class="sans" style="font-size:11.5px;color:#B5A88F">共 12 卦</span>
        </div>
        <div class="card" style="padding:15px 16px;display:flex;flex-direction:column;gap:10px">
          <div style="display:flex;align-items:center;gap:11px">
            <span style="width:36px;flex-shrink:0;font-size:13.5px">感情</span>
            <span style="height:10px;width:190px;border-radius:999px;background:#B08A4A"></span>
            <span class="sans" style="font-size:12px;color:#8A7C68">5</span></div>
          <div style="display:flex;align-items:center;gap:11px">
            <span style="width:36px;flex-shrink:0;font-size:13.5px">財</span>
            <span style="height:10px;width:152px;border-radius:999px;background:#B08A4A"></span>
            <span class="sans" style="font-size:12px;color:#8A7C68">4</span></div>
          <div style="display:flex;align-items:center;gap:11px">
            <span style="width:36px;flex-shrink:0;font-size:13.5px">事業</span>
            <span style="height:10px;width:76px;border-radius:999px;background:#B08A4A"></span>
            <span class="sans" style="font-size:12px;color:#8A7C68">2</span></div>
          <div style="display:flex;align-items:center;gap:11px">
            <span style="width:36px;flex-shrink:0;font-size:13.5px">其他</span>
            <span style="height:10px;width:38px;border-radius:999px;background:#B08A4A"></span>
            <span class="sans" style="font-size:12px;color:#8A7C68">1</span></div>
        </div>
      </div>

      <!-- 所應 -->
      <div style="display:flex;flex-direction:column;gap:12px">
        <div style="display:flex;align-items:baseline;justify-content:space-between;padding:0 4px">
          <span class="sans" style="font-size:11px;letter-spacing:.24em;color:#B5A88F">所　應</span>
          <span class="sans" style="font-size:11.5px;color:#B5A88F">應期到者 7・你回了 5</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px">
          <div class="card" style="padding:13px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;background:#F2F5EC;border-color:#CBD9B9">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#7A9163" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 13 4.5 4.5L19 7"></path></svg>
            <span class="sans" style="font-size:20px;color:#5f7a49;line-height:1.1;font-weight:500">3</span>
            <span class="sans" style="font-size:11.5px;color:#8A7C68">應驗</span></div>
          <div class="card" style="padding:13px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;background:#FAF4E6;border-color:#E7D9B8">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#B08A4A" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 4a8 8 0 0 1 0 16z" fill="#B08A4A" stroke="none"></path></svg>
            <span class="sans" style="font-size:20px;color:#8d6c36;line-height:1.1;font-weight:500">1</span>
            <span class="sans" style="font-size:11.5px;color:#8A7C68">部分</span></div>
          <div class="card" style="padding:13px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;background:#FAF0EC;border-color:#E3C6BF">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#C07A4A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10"></path><path d="M17 7 7 17"></path></svg>
            <span class="sans" style="font-size:20px;color:#a9613a;line-height:1.1;font-weight:500">1</span>
            <span class="sans" style="font-size:11.5px;color:#8A7C68">未應</span></div>
        </div>
      </div>

      <!-- 未了 -->
      <div style="display:flex;flex-direction:column;gap:10px">
        <span class="sans" style="font-size:11px;letter-spacing:.24em;color:#B5A88F;padding:0 4px">未　了</span>
        <div class="card" style="padding:15px 16px;border-left:3px solid #C0483A">
          <div style="font-size:15.5px">阿凱這條線</div>
          <div style="font-size:13px;color:#8A7C68;line-height:1.8">從正月十二問到現在，五十六日。這是你這半年裡問得最久的一件事。</div>
        </div>
      </div>

      <!-- 一句話 -->
      <div class="card" style="padding:15px 16px;display:flex;gap:12px;background:#FDF6E8;border-color:#E7D9B8">
        <div style="width:38px;height:38px;flex-shrink:0;border-radius:50%;background:#E4B8AE;display:flex;align-items:center;justify-content:center;font-size:15px;color:#6d3f36">妹</div>
        <div style="flex:1;min-width:0">
          <div style="font-size:13.5px;color:#8d6c36">師妹</div>
          <div style="font-size:15px;line-height:1.9">「你這個月問得比上個月少了。這不是壞事。」</div>
        </div>
      </div>

      <!-- 落款 -->
      <div style="display:flex;align-items:center;justify-content:flex-end;gap:12px;padding:2px 4px 0">
        <span class="sans" style="font-size:11px;color:#B5A88F">幾知觀　司籍錄　三月初一</span>
        <div style="width:32px;height:32px;border:1.5px solid #C0483A;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;color:#C0483A;transform:rotate(-8deg)">牒</div>
      </div>

    </div>
  </div>

  <button aria-label="貼紙口袋" style="position:absolute;right:16px;bottom:22px;width:56px;height:56px;border-radius:50%;background:#FFFDF8;border:1px solid #E0D5BF;box-shadow:0 6px 18px -8px rgba(58,50,42,.5);display:flex;align-items:center;justify-content:center;padding:0"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#B08A4A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5V14l-6 6H5.5A1.5 1.5 0 0 1 4 18.5Z"></path><path d="M20 14h-4.5a1.5 1.5 0 0 0-1.5 1.5V20"></path></svg></button>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
