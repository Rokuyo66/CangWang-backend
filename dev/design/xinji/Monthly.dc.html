<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600&display=swap">
  <style>
    body{margin:0;font-family:"Noto Serif TC","Songti TC",serif;line-height:1.75;
      -webkit-font-smoothing:antialiased}
    a{color:#c8a86b}a:hover{color:#e0c48a}
    *{box-sizing:border-box}
    button{font-family:inherit;color:inherit;cursor:pointer}
  </style>
</helmet>

<div style="width:390px;height:844px;background:#12100e;color:#e8e0d4;display:flex;flex-direction:column;overflow:hidden">

  <div style="height:47px;flex-shrink:0"></div>

  <div style="display:flex;align-items:center;gap:10px;padding:0 22px 12px;flex-shrink:0">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#8b8073" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m14 6-6 6 6 6"></path></svg>
    <span style="font-size:12px;letter-spacing:.16em;color:#8b8073">月誌</span>
  </div>

  <div style="flex:1;overflow-y:auto;padding:0 22px 24px">
    <div style="display:flex;flex-direction:column;gap:22px">

      <!-- 卷首 -->
      <div style="border:1px solid #332c25;border-top:2px solid #9c3b30;background:#161310;padding:20px 18px;display:flex;flex-direction:column;gap:14px">
        <div style="display:flex;align-items:baseline;justify-content:space-between">
          <span style="font-size:19px;letter-spacing:.16em">二月卷</span>
          <span style="font-size:11px;letter-spacing:.12em;color:#5f574c">錄與　守拙</span>
        </div>
        <div style="font-size:14.5px;line-height:2.05;color:#cfc5b6">
          這一月你問得急。二月初九那幾天，一天之內起了三卦，問的其實是同一件事——
          卦沒有變壞，是你等不及。<br><br>
          月末那兩卦，語氣鬆了。你大概是自己想通了什麼。
        </div>
      </div>

      <!-- 所問 -->
      <div style="display:flex;flex-direction:column;gap:13px">
        <div style="display:flex;align-items:baseline;justify-content:space-between">
          <span style="font-size:11px;letter-spacing:.28em;color:#5f574c">所　問</span>
          <span style="font-size:11.5px;color:#5f574c;font-variant-numeric:tabular-nums">共 12 卦</span>
        </div>
        <div style="display:flex;flex-direction:column;gap:9px">
          <div style="display:flex;align-items:center;gap:11px">
            <span style="width:38px;flex-shrink:0;font-size:13px;color:#a89c8c">感情</span>
            <span style="height:9px;width:250px;background:#c8a86b"></span>
            <span style="font-size:12px;color:#8b8073;font-variant-numeric:tabular-nums">5</span>
          </div>
          <div style="display:flex;align-items:center;gap:11px">
            <span style="width:38px;flex-shrink:0;font-size:13px;color:#a89c8c">財</span>
            <span style="height:9px;width:200px;background:#c8a86b"></span>
            <span style="font-size:12px;color:#8b8073;font-variant-numeric:tabular-nums">4</span>
          </div>
          <div style="display:flex;align-items:center;gap:11px">
            <span style="width:38px;flex-shrink:0;font-size:13px;color:#a89c8c">事業</span>
            <span style="height:9px;width:100px;background:#c8a86b"></span>
            <span style="font-size:12px;color:#8b8073;font-variant-numeric:tabular-nums">2</span>
          </div>
          <div style="display:flex;align-items:center;gap:11px">
            <span style="width:38px;flex-shrink:0;font-size:13px;color:#a89c8c">其他</span>
            <span style="height:9px;width:50px;background:#c8a86b"></span>
            <span style="font-size:12px;color:#8b8073;font-variant-numeric:tabular-nums">1</span>
          </div>
        </div>
      </div>

      <!-- 所應 -->
      <div style="display:flex;flex-direction:column;gap:13px">
        <div style="display:flex;align-items:baseline;justify-content:space-between">
          <span style="font-size:11px;letter-spacing:.28em;color:#5f574c">所　應</span>
          <span style="font-size:11.5px;color:#5f574c;font-variant-numeric:tabular-nums">應期到者 7　你回了 5</span>
        </div>
        <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px">
          <div style="border:1px solid #2f3a2a;background:#161310;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7d9a6a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 13 4.5 4.5L19 7"></path></svg>
            <span style="font-size:19px;color:#7d9a6a;font-variant-numeric:tabular-nums;line-height:1.1">3</span>
            <span style="font-size:11.5px;color:#8b8073;letter-spacing:.1em">應驗</span>
          </div>
          <div style="border:1px solid #3d342b;background:#161310;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#c8a86b" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 4a8 8 0 0 1 0 16z" fill="#c8a86b" stroke="none"></path></svg>
            <span style="font-size:19px;color:#c8a86b;font-variant-numeric:tabular-nums;line-height:1.1">1</span>
            <span style="font-size:11.5px;color:#8b8073;letter-spacing:.1em">部分</span>
          </div>
          <div style="border:1px solid #43302a;background:#161310;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#a8623f" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M7 7l10 10"></path><path d="M17 7 7 17"></path></svg>
            <span style="font-size:19px;color:#a8623f;font-variant-numeric:tabular-nums;line-height:1.1">1</span>
            <span style="font-size:11.5px;color:#8b8073;letter-spacing:.1em">未應</span>
          </div>
        </div>
      </div>

      <!-- 未了 -->
      <div style="display:flex;flex-direction:column;gap:11px">
        <span style="font-size:11px;letter-spacing:.28em;color:#5f574c">未　了</span>
        <div style="border:1px solid #332c25;border-left:2px solid #9c3b30;background:#1a1714;padding:14px 15px;display:flex;flex-direction:column;gap:7px">
          <span style="font-size:15px">阿凱這條線</span>
          <span style="font-size:13px;color:#8b8073;line-height:1.75">從正月十二問到現在，五十六日。這是你這半年裡問得最久的一件事。</span>
        </div>
      </div>

      <!-- 一句話 -->
      <div style="display:flex;gap:12px;border-top:1px solid #262019;padding-top:18px">
        <div style="width:34px;height:34px;flex-shrink:0;border:1px solid #c8a86b;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:#c8a86b">妹</div>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:7px">
          <span style="font-size:13px;letter-spacing:.12em;color:#c8a86b">師妹</span>
          <span style="font-size:14.5px;line-height:1.9">「你這個月問得比上個月少了。這不是壞事。」</span>
        </div>
      </div>

      <!-- 落款 -->
      <div style="display:flex;align-items:center;justify-content:flex-end;gap:12px;padding-top:6px">
        <span style="font-size:11px;color:#5f574c;letter-spacing:.1em">幾知觀　司籍錄　三月初一</span>
        <div style="width:30px;height:30px;border:1.5px solid #9c3b30;display:flex;align-items:center;justify-content:center;font-size:13px;color:#9c3b30">牒</div>
      </div>

    </div>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
