<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@400;500&display=swap">
  <style>
    body{margin:0;font-family:"Noto Serif TC","Songti TC",serif;line-height:1.75;
      -webkit-font-smoothing:antialiased;color:#3A322A}
    a{color:#B08A4A}a:hover{color:#8d6c36}
    *{box-sizing:border-box}
    button{font-family:inherit;color:inherit;cursor:pointer}
    .sans{font-family:"Noto Sans TC",system-ui,sans-serif}
    /* 手帳欄線：27/28 對齊 line-height，卡片內文才會坐在線上 */
    .ruled{background-image:repeating-linear-gradient(to bottom,
      transparent 0,transparent 27px,#E6DCC8 27px,#E6DCC8 28px)}
    .card{background:#FFFDF8;border:1px solid #E0D5BF;border-radius:14px;
      box-shadow:0 1px 0 rgba(58,50,42,.04),0 6px 16px -12px rgba(58,50,42,.35)}
    .tape{position:absolute;height:22px;border-radius:2px;opacity:.9;
      box-shadow:0 1px 2px rgba(58,50,42,.10)}
    .stk{position:absolute;filter:drop-shadow(0 3px 5px rgba(58,50,42,.18))}
  </style>
</helmet>

<div style="width:390px;height:844px;background:#F7F3EA;display:flex;flex-direction:column;overflow:hidden;position:relative">

  <div style="height:47px;flex-shrink:0"></div>

  <!-- 冊名 -->
  <div style="display:flex;align-items:baseline;justify-content:space-between;padding:2px 22px 12px">
    <div style="display:flex;align-items:baseline;gap:10px">
      <span style="font-size:24px;letter-spacing:.2em;font-weight:600">心跡</span>
      <span class="sans" style="font-size:11px;letter-spacing:.08em;color:#B5A88F">乙巳・六月廿三</span>
    </div>
    <span class="sans" style="font-size:11.5px;color:#8A7C68">在記 2 事</span>
  </div>

  <!-- 分頁 -->
  <div style="display:flex;gap:8px;padding:0 22px 14px;flex-shrink:0">
    <div style="padding:6px 16px;border-radius:999px;background:#3A322A;color:#F7F3EA;font-size:13.5px;letter-spacing:.12em">心事</div>
    <div style="padding:6px 16px;border-radius:999px;background:#EDE6D7;color:#8A7C68;font-size:13.5px;letter-spacing:.12em">月誌</div>
    <div style="padding:6px 16px;border-radius:999px;background:#EDE6D7;color:#8A7C68;font-size:13.5px;letter-spacing:.12em">語音</div>
  </div>

  <!-- 冊頁 -->
  <div style="flex:1;overflow-y:auto;padding:4px 18px 92px;position:relative">
    <div style="display:flex;flex-direction:column;gap:16px">

      <!-- 心事一 -->
      <div style="position:relative">
        <div class="tape" style="width:74px;left:26px;top:-7px;background:#E9C7BE;transform:rotate(-3.5deg)"></div>
        <div class="card ruled" style="padding:18px 16px 15px">
          <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:6px">
            <span style="font-size:17px;font-weight:500">阿凱這條線</span>
            <span class="sans" style="font-size:10.5px;color:#8A7C68;background:#E9C7BE;border-radius:999px;padding:2px 9px">感情</span>
          </div>
          <div style="font-size:13.5px;color:#8A7C68">已問三卦・最近《澤山咸》</div>
          <div style="font-size:14px;margin-top:2px">師妹說：他心裡有你，但他在等一個台階。</div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:9px">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#B08A4A" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>
            <span class="sans" style="font-size:12.5px;color:#B08A4A">應期 三月十四・還有 5 日</span>
          </div>
        </div>
        <!-- 銅錢貼紙 -->
        <svg class="stk" width="42" height="42" viewBox="0 0 44 44" style="right:-6px;top:-14px;transform:rotate(12deg)" aria-hidden="true">
          <circle cx="22" cy="22" r="19" fill="#E7C98A" stroke="#B08A4A" stroke-width="2"></circle>
          <rect x="16" y="16" width="12" height="12" rx="1.5" fill="#F7F3EA" stroke="#B08A4A" stroke-width="1.6"></rect>
        </svg>
      </div>

      <!-- 心事二：應期已過 -->
      <div style="position:relative">
        <div class="card" style="padding:18px 16px 14px;border-color:#E3C6BF">
          <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:6px">
            <span style="font-size:17px;font-weight:500">那筆尾款</span>
            <span class="sans" style="font-size:10.5px;color:#6f7d59;background:#CBD9B9;border-radius:999px;padding:2px 9px">財</span>
          </div>
          <div style="font-size:13.5px;color:#8A7C68">已問兩卦・最近《水天需》</div>
          <div style="font-size:14px;margin-top:2px">大師兄說：錢會到，但不會是你催來的。</div>
          <div style="display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:1px dashed #E0D5BF">
            <span style="flex:1;font-size:13px;color:#C0483A">應期三月初九已過——後來呢？</span>
            <button class="sans" style="min-height:44px;background:#C0483A;border:none;border-radius:999px;padding:0 18px;font-size:13.5px;color:#FFFDF8">回報</button>
          </div>
        </div>
      </div>

      <!-- 角色留言 -->
      <div style="position:relative">
        <div class="card" style="padding:16px;display:flex;gap:12px;background:#FDF6E8;border-color:#E7D9B8">
          <div style="width:38px;height:38px;flex-shrink:0;border-radius:50%;background:#E7C98A;display:flex;align-items:center;justify-content:center;font-size:15px;color:#6b5326">喵</div>
          <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:8px">
            <div style="display:flex;align-items:baseline;gap:8px">
              <span style="font-size:13.5px;color:#8d6c36">觀喵</span>
              <span class="sans" style="font-size:10.5px;color:#B5A88F">昨夜留</span>
            </div>
            <div style="font-size:15px;line-height:1.85">「上次你問那個男的，後來呢？」</div>
            <div style="display:flex;align-items:center;gap:10px">
              <button class="sans" style="min-height:44px;display:flex;align-items:center;gap:7px;background:#FFFDF8;border:1px solid #D9C79C;border-radius:999px;padding:0 16px;font-size:13.5px;color:#8d6c36">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 6 6v5"></path></svg>
                回牠一句
              </button>
              <span class="sans" style="font-size:11px;color:#B5A88F">今日尚餘 6 句</span>
            </div>
          </div>
        </div>
        <!-- 貓爪貼紙 -->
        <svg class="stk" width="34" height="34" viewBox="0 0 36 36" style="right:8px;bottom:-12px;transform:rotate(-14deg)" aria-hidden="true">
          <ellipse cx="18" cy="23" rx="9.5" ry="8" fill="#E4B8AE"></ellipse>
          <circle cx="9" cy="13" r="3.6" fill="#E4B8AE"></circle>
          <circle cx="16" cy="10" r="3.8" fill="#E4B8AE"></circle>
          <circle cx="23.5" cy="11.5" r="3.6" fill="#E4B8AE"></circle>
          <circle cx="29" cy="17" r="3.2" fill="#E4B8AE"></circle>
        </svg>
      </div>

      <div class="sans" style="font-size:11px;letter-spacing:.24em;color:#B5A88F;margin-top:6px">已　了</div>

      <div style="position:relative">
        <div class="card" style="padding:14px 16px;display:flex;align-items:center;gap:12px;background:#F4EFE3;box-shadow:none">
          <div style="flex:1;min-width:0">
            <div style="font-size:15.5px;color:#8A7C68">換工作那件事</div>
            <div class="sans" style="font-size:11.5px;color:#B5A88F">三卦・歷四十一日・二月十七結</div>
          </div>
          <div style="width:38px;height:38px;flex-shrink:0;border:1.5px solid #C0483A;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;color:#C0483A;transform:rotate(-7deg)">應</div>
        </div>
      </div>

    </div>
  </div>

  <!-- 貼紙口袋（右下）：點開抽屜，拖出來貼 -->
  <button aria-label="貼紙口袋" style="position:absolute;right:16px;bottom:104px;width:56px;height:56px;border-radius:50%;background:#FFFDF8;border:1px solid #E0D5BF;box-shadow:0 6px 18px -8px rgba(58,50,42,.5);display:flex;align-items:center;justify-content:center;padding:0">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#B08A4A" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M4 5.5A1.5 1.5 0 0 1 5.5 4h13A1.5 1.5 0 0 1 20 5.5V14l-6 6H5.5A1.5 1.5 0 0 1 4 18.5Z"></path>
      <path d="M20 14h-4.5a1.5 1.5 0 0 0-1.5 1.5V20"></path>
    </svg>
  </button>

  <!-- 底部導覽 -->
  <div style="position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));background:#FFFDF8;border-top:1px solid #E6DCC8;padding-top:9px;padding-bottom:22px">
    <div class="sans" style="display:flex;flex-direction:column;align-items:center;gap:4px;min-height:44px;color:#B5A88F">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 10h7"></path><path d="M4 14h16"></path><path d="M4 18h7"></path></svg>
      <span style="font-size:10.5px">排盤</span>
    </div>
    <div class="sans" style="display:flex;flex-direction:column;align-items:center;gap:4px;min-height:44px;color:#B5A88F">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15a3 3 0 0 1-3 3H8l-4 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3Z"></path></svg>
      <span style="font-size:10.5px">廣場</span>
    </div>
    <div class="sans" style="display:flex;flex-direction:column;align-items:center;gap:4px;min-height:44px;color:#B08A4A">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"></path><path d="M9 9h6"></path><path d="M9 13h6"></path><path d="M9 17h3"></path></svg>
      <span style="font-size:10.5px;font-weight:500">心跡</span>
    </div>
    <div class="sans" style="display:flex;flex-direction:column;align-items:center;gap:4px;min-height:44px;color:#B5A88F">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 4a8 8 0 0 0 0 16"></path></svg>
      <span style="font-size:10.5px">道緣</span>
    </div>
    <div class="sans" style="display:flex;flex-direction:column;align-items:center;gap:4px;min-height:44px;color:#B5A88F">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20a7 7 0 0 1 14 0"></path></svg>
      <span style="font-size:10.5px">我</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
