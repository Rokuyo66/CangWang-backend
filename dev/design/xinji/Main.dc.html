<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;400;500;600&display=swap">
  <style>
    body{margin:0;font-family:"Noto Serif TC","Songti TC",serif;line-height:1.75;
      -webkit-font-smoothing:antialiased}
    a{color:#c8a86b}a:hover{color:#e0c48a}
    *{box-sizing:border-box}
    button{font-family:inherit;color:inherit;cursor:pointer}
  </style>
</helmet>

<div style="width:390px;height:844px;background:#12100e;color:#e8e0d4;display:flex;flex-direction:column;overflow:hidden">

  <!-- 天頭：留給系統列 -->
  <div style="height:47px;flex-shrink:0"></div>

  <!-- 冊名 -->
  <div style="display:flex;align-items:baseline;justify-content:space-between;padding:0 22px 14px">
    <div style="display:flex;align-items:baseline;gap:10px">
      <span style="font-size:23px;letter-spacing:.22em;font-weight:500">心跡</span>
      <span style="font-size:11px;letter-spacing:.16em;color:#5f574c">乙巳年 六月廿三</span>
    </div>
    <span style="font-size:11px;letter-spacing:.14em;color:#8b8073;font-variant-numeric:tabular-nums">在記 2 事</span>
  </div>

  <!-- 分頁 -->
  <div style="display:flex;gap:26px;padding:0 22px;border-bottom:1px solid #262019;flex-shrink:0">
    <div style="padding-bottom:11px;border-bottom:1px solid #c8a86b;font-size:14px;letter-spacing:.18em;color:#c8a86b">心事</div>
    <div style="padding-bottom:11px;font-size:14px;letter-spacing:.18em;color:#6e665b">月誌</div>
  </div>

  <!-- 冊頁 -->
  <div style="flex:1;overflow-y:auto;padding:20px 22px 16px;
    background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 27px,rgba(232,224,212,.035) 27px,rgba(232,224,212,.035) 28px)">

    <div style="display:flex;flex-direction:column;gap:14px">

      <div style="font-size:11px;letter-spacing:.28em;color:#5f574c">記　掛</div>

      <!-- 心事一：應期將至 -->
      <div style="display:flex;gap:12px;background:#1a1714;border:1px solid #332c25;border-left:2px solid #9c3b30;padding:14px 15px 15px">
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:7px">
          <div style="display:flex;align-items:baseline;gap:8px">
            <span style="font-size:16px;letter-spacing:.04em">阿凱這條線</span>
            <span style="font-size:10px;letter-spacing:.16em;color:#8b8073;border:1px solid #3d342b;padding:1px 6px">感情</span>
          </div>
          <div style="font-size:13px;color:#8b8073;line-height:1.7">已問三卦　最近一卦《澤山咸》<br>師妹說：他心裡有你，但他在等一個台階。</div>
          <div style="display:flex;align-items:center;gap:9px;padding-top:3px">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#c8a86b" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
              <circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path>
            </svg>
            <span style="font-size:12.5px;color:#c8a86b;font-variant-numeric:tabular-nums">應期 三月十四　還有 5 日</span>
          </div>
        </div>
      </div>

      <!-- 心事二：應期已過，待回評 -->
      <div style="display:flex;flex-direction:column;gap:11px;background:#1a1714;border:1px solid #332c25;padding:14px 15px 15px">
        <div style="display:flex;align-items:baseline;gap:8px">
          <span style="font-size:16px;letter-spacing:.04em">那筆尾款</span>
          <span style="font-size:10px;letter-spacing:.16em;color:#8b8073;border:1px solid #3d342b;padding:1px 6px">財</span>
        </div>
        <div style="font-size:13px;color:#8b8073;line-height:1.7">已問兩卦　最近一卦《水天需》<br>大師兄說：錢會到，但不會是你催來的。</div>
        <div style="display:flex;align-items:center;gap:10px;border-top:1px dashed #332c25;padding-top:11px">
          <span style="flex:1;font-size:12.5px;color:#a8623f">應期三月初九已過——後來呢？</span>
          <button style="min-height:44px;background:none;border:1px solid #3d342b;padding:0 15px;font-size:13px;letter-spacing:.1em;color:#e8e0d4">回報</button>
        </div>
      </div>

      <!-- 角色留言 -->
      <div style="display:flex;gap:12px;background:#171410;border:1px solid #2b241d;padding:14px 15px">
        <div style="width:34px;height:34px;flex-shrink:0;border:1px solid #c8a86b;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;color:#c8a86b">喵</div>
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:9px">
          <div style="display:flex;align-items:baseline;gap:8px">
            <span style="font-size:13px;letter-spacing:.12em;color:#c8a86b">觀喵</span>
            <span style="font-size:10.5px;color:#5f574c">昨夜留</span>
          </div>
          <div style="font-size:14px;line-height:1.8">「上次你問那個男的，後來呢？」</div>
          <div style="display:flex;align-items:center;gap:10px">
            <button style="min-height:44px;display:flex;align-items:center;gap:7px;background:none;border:1px solid #4a3f31;padding:0 15px;font-size:13px;letter-spacing:.1em;color:#c8a86b">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 14 4 9l5-5"></path><path d="M4 9h10a6 6 0 0 1 6 6v5"></path>
              </svg>
              回牠一句
            </button>
            <span style="font-size:11px;color:#5f574c">今日尚餘 6 句</span>
          </div>
        </div>
      </div>

      <div style="font-size:11px;letter-spacing:.28em;color:#5f574c;margin-top:8px">已　了</div>

      <!-- 已結案 -->
      <div style="display:flex;align-items:center;gap:13px;background:#151310;border:1px solid #241e18;padding:13px 15px">
        <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px">
          <span style="font-size:15px;color:#a89c8c;letter-spacing:.04em">換工作那件事</span>
          <span style="font-size:12px;color:#5f574c">三卦　歷四十一日　二月十七結</span>
        </div>
        <div style="width:36px;height:36px;flex-shrink:0;border:1.5px solid #9c3b30;display:flex;align-items:center;justify-content:center;font-size:15px;color:#9c3b30;letter-spacing:0">應</div>
      </div>

    </div>
  </div>

  <!-- 底部導覽 -->
  <div style="flex-shrink:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));border-top:1px solid #262019;background:#0f0d0b;padding-top:8px;padding-bottom:22px">
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;min-height:44px;color:#6e665b">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16"></path><path d="M4 10h7"></path><path d="M4 14h16"></path><path d="M4 18h7"></path></svg>
      <span style="font-size:10.5px;letter-spacing:.1em">排盤</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;min-height:44px;color:#6e665b">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 15a3 3 0 0 1-3 3H8l-4 3V6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3Z"></path></svg>
      <span style="font-size:10.5px;letter-spacing:.1em">廣場</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;min-height:44px;color:#c8a86b">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"></path><path d="M9 9h6"></path><path d="M9 13h6"></path><path d="M9 17h3"></path></svg>
      <span style="font-size:10.5px;letter-spacing:.1em">心跡</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;min-height:44px;color:#6e665b">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"></circle><path d="M12 4a8 8 0 0 0 0 16"></path></svg>
      <span style="font-size:10.5px;letter-spacing:.1em">道緣</span>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:5px;min-height:44px;color:#6e665b">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"></circle><path d="M5 20a7 7 0 0 1 14 0"></path></svg>
      <span style="font-size:10.5px;letter-spacing:.1em">我</span>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {}
</script>
</body>
</html>
